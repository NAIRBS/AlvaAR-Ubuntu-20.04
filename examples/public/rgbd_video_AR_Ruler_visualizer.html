<!DOCTYPE html>
<html lang="en">
<head>

  <meta content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,shrink-to-fit=no" name="viewport"/>
  <meta content="IE=edge" http-equiv="X-UA-Compatible"/>
  <title>RGBD Video AR Ruler - Distance Measurement</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      font-family: 'Helvetica', sans-serif;
      overflow: hidden;
      background: #000;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #main-container {
      display: flex;
      gap: 20px;
      align-items: flex-start;
    }

    #container {
      position: relative;
      width: 1280px;
      height: 480px;
      overflow: hidden;
      line-height: 0;
      border: 2px solid #333;
      box-shadow: 0 0 10px #000;
    }

    #container > * {
      position: absolute;
      display: block;
      user-select: none;
      top: 0;
      left: 0;
      width: 1280px;
      height: 480px;
      animation: fadeIn 1.2s;
    }

    #measurement-panel {
      width: 320px;
      height: 480px;
      border: 2px solid #333;
      box-shadow: 0 0 10px #000;
      background: #fff;
      position: relative;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }

    #visualizer-panel {
      width: 400px;
      height: 480px;
      border: 2px solid #333;
      box-shadow: 0 0 10px #000;
      background: #fff;
      position: relative;
    }

    #visualizer-panel::after {
      content: "3D Scene Visualizer";
      position: absolute;
      top: 10px;
      left: 10px;
      color: #333;
      font-size: 14px;
      font-weight: bold;
      z-index: 10;
    }

    #measurement-panel::after {
      content: "AR Ruler - Distance Tool (RGBD Video)";
      position: absolute;
      top: 10px;
      left: 10px;
      color: #333;
      font-size: 14px;
      font-weight: bold;
      z-index: 10;
    }

    #distance-display {
      font-size: 2rem;
      font-weight: bold;
      text-align: center;
      margin: 20px 0 10px 0;
      padding: 15px;
      background: #f0f0f0;
      border-radius: 10px;
      border: 2px solid #333;
    }

    #status-display {
      font-size: 1rem;
      text-align: center;
      margin: 0 0 20px 0;
      padding: 8px;
      background: #e8f4fd;
      border-radius: 5px;
      border: 1px solid #007bff;
      color: #0056b3;
    }

    #crosshair {
      position: absolute;
      top: 50%;
      left: 320px; /* Center of left camera frame (640px / 2) */
      transform: translate(-50%, -50%);
      width: 20px;
      height: 20px;
      pointer-events: none;
      z-index: 1000;
    }

    #crosshair::before,
    #crosshair::after {
      content: '';
      position: absolute;
      background: #ffffff;
      box-shadow: 0 0 2px rgba(0, 0, 0, 0.8);
    }

    #crosshair::before {
      width: 2px;
      height: 20px;
      left: 50%;
      top: 0;
      transform: translateX(-50%);
    }

    #crosshair::after {
      width: 20px;
      height: 2px;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
    }

    #control-buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: auto;
    }

    #control-buttons button {
      padding: 12px 16px;
      font-size: 14px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    #place-marker {
      background: #28a745;
      color: white;
    }

    #place-marker:hover {
      background: #218838;
    }

    #end-measurement {
      background: #dc3545;
      color: white;
    }

    #end-measurement:hover {
      background: #c82333;
    }

    #reset-measurement {
      background: #6c757d;
      color: white;
    }

    #reset-measurement:hover {
      background: #5a6268;
    }

    #draw-plane {
      background: #007bff;
      color: white;
    }

    #draw-plane:hover {
      background: #0056b3;
    }

    #draw-plane.plane-active {
      background: #28a745;
    }

    #draw-plane.plane-active:hover {
      background: #218838;
    }

    canvas {
      display: block;
      width: 1280px;
      height: 480px;
    }

    #splash {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      opacity: 1;
    }

    #overlay {
      position: absolute;
      font-size: 16px;
      z-index: 2;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: rgba(0, 0, 0, 0.5);
    }

    #overlay::before {
      position: absolute;
      width: 100%;
      white-space: pre-wrap;
      content: "RGBD Video AR Ruler - Distance Measurement \A Using pre-recorded RGBD stereo video \A (v2_ruler_left_web.mp4 / v2_ruler_right_web.mp4)";
      top: calc(50% + 50px);
      text-align: center;
      color: #949494;
    }

    #overlay button {
      background: transparent;
      border: 1px solid white;
      border-radius: 4px;
      color: white;
      padding: 12px 18px;
      text-transform: uppercase;
      cursor: pointer;
    }

    @keyframes fadeIn {
      0% { opacity: 0; }
      50% { opacity: 0.6; }
      100% { opacity: 1; }
    }

    @media screen and (max-device-width: 480px) and (orientation: landscape) {
      #main-container { display: none; }
      body::before {
        content: "Rotate device to portrait mode.";
        color: white;
      }
    }

    @media screen and (max-device-width: 480px) and (orientation: portrait) {
      #main-container { display: flex; }
      body::before { content: none; }
    }
  </style>

<div id="overlay">

<script type="module">
  import Module from './assets/alva_ar.js';
  import { Stats } from './assets/stats.js';
  import { ARSimpleView, ARSimpleMap } from './assets/view.js';
  import { Video } from './assets/utils.js';
  import * as THREE from 'https://threejsfundamentals.org/threejs/resources/threejs/r132/build/three.module.js';

  // Centralized monocular scale factor for AR ruler measurements
  const MONOCULAR_SCALE_FACTOR = 50;

  async function waitForEmscriptenModule(ModuleInstance) {
    return new Promise(resolve => {
      if (ModuleInstance && ModuleInstance.calledRun) {
        resolve();
      } else if (ModuleInstance && typeof ModuleInstance.onRuntimeInitialized === 'function') {
        ModuleInstance.onRuntimeInitialized = resolve;
      } else {
        const check = setInterval(() => {
          if (ModuleInstance && ModuleInstance.calledRun) {
            clearInterval(check);
            resolve();
          }
        }, 50);
      }
    });
  }

  // Parse calibration YAML to extract left camera intrinsics
  function parseCalibrationYAML(yamlText) {
    const lines = yamlText.split('\n');
    let kMatrixData = null;
    let inKMatrix = false;
    let dataLine = '';
    
    for (const line of lines) {
      const trimmedLine = line.trim();
      
      // Look for LEFT.K matrix
      if (trimmedLine === 'LEFT.K: !!opencv-matrix') {
        inKMatrix = true;
        continue;
      }
      
      // If we're in the K matrix section, look for data
      if (inKMatrix) {
        if (trimmedLine.startsWith('data: [')) {
          dataLine = trimmedLine;
          break;
        }
      }
    }
    
    if (dataLine) {
      // Extract the data array from the line
      // Format: "data: [385.004, 0.0, 325.346, 0.0, 385.004, 238.491, 0.0, 0.0, 1.0]"
      const dataMatch = dataLine.match(/data:\s*\[(.*?)\]/);
      if (dataMatch) {
        const dataString = dataMatch[1];
        const values = dataString.split(',').map(v => parseFloat(v.trim()));
        
        if (values.length >= 9) {
          // OpenCV 3x3 matrix format: [fx, 0, cx, 0, fy, cy, 0, 0, 1]
          return {
            fx: values[0],  // 385.004
            fy: values[4],  // 385.004
            cx: values[2],  // 325.346
            cy: values[5]   // 238.491
          };
        }
      }
    }
    
    throw new Error('Could not parse LEFT.K matrix from YAML');
  }

  // Draw plane outline on 2D frame
  function drawPlaneOutlineOnFrame(ctx, plane, pose, cameraIntrinsics) {
    if (!plane || !pose || !cameraIntrinsics) return;
    
    // Get camera intrinsics
    const fx = cameraIntrinsics.fx;
    const fy = cameraIntrinsics.fy;
    const cx = cameraIntrinsics.cx;
    const cy = cameraIntrinsics.cy;
    
    // Get camera position and direction from pose
    const cameraPosition = new THREE.Vector3(pose[12], -pose[13], -pose[14]);
    const rotationMatrix = new THREE.Matrix4().fromArray(pose);
    const quaternion = new THREE.Quaternion().setFromRotationMatrix(rotationMatrix);
    quaternion.set(-quaternion.x, quaternion.y, quaternion.z, quaternion.w);
    
    // Create a grid of points on the plane to project to 2D
    const planeSize = 5; // 5x5 meter plane
    const gridResolution = 20; // 20x20 grid points
    const gridPoints = [];
    
    // Create two orthogonal vectors on the plane
    const planeNormal = plane.normal.clone();
    const planePoint = plane.point.clone();
    
    // Find two orthogonal vectors on the plane
    let u = new THREE.Vector3(1, 0, 0);
    if (Math.abs(planeNormal.dot(u)) > 0.9) {
      u = new THREE.Vector3(0, 1, 0);
    }
    u = u.clone().sub(planeNormal.clone().multiplyScalar(planeNormal.dot(u))).normalize();
    const v = planeNormal.clone().cross(u).normalize();
    
    // Generate grid points on the plane
    for (let i = 0; i <= gridResolution; i++) {
      for (let j = 0; j <= gridResolution; j++) {
        const uOffset = (i / gridResolution - 0.5) * planeSize;
        const vOffset = (j / gridResolution - 0.5) * planeSize;
        
        const gridPoint = planePoint.clone()
          .add(u.clone().multiplyScalar(uOffset))
          .add(v.clone().multiplyScalar(vOffset));
        
        gridPoints.push(gridPoint);
      }
    }
    
    // Project grid points to 2D and draw lines
    const projectedPoints = [];
    
    for (const point3D of gridPoints) {
      // Transform to camera coordinate system
      const cameraPoint = point3D.clone().sub(cameraPosition);
      const rotatedPoint = cameraPoint.clone().applyQuaternion(quaternion);
      
      // Project to 2D
      if (rotatedPoint.z > 0.1) { // Only points in front of camera
        const x = (rotatedPoint.x * fx / rotatedPoint.z) + cx;
        const y = (rotatedPoint.y * fy / rotatedPoint.z) + cy;
        
        // Only include points within image bounds
        if (x >= 0 && x < 640 && y >= 0 && y < 480) {
          projectedPoints.push({x, y, z: rotatedPoint.z});
        }
      }
    }
    
    if (projectedPoints.length < 4) return; // Need at least 4 points to draw a plane
    
    // Draw horizontal grid lines
    ctx.strokeStyle = 'rgba(0, 255, 0, 0.6)'; // Green with transparency
    ctx.lineWidth = 2;
    ctx.beginPath();
    
    for (let i = 0; i <= gridResolution; i++) {
      const rowPoints = [];
      for (let j = 0; j <= gridResolution; j++) {
        const idx = i * (gridResolution + 1) + j;
        if (idx < projectedPoints.length) {
          rowPoints.push(projectedPoints[idx]);
        }
      }
      
      if (rowPoints.length > 1) {
        // Sort by x coordinate for smooth line
        rowPoints.sort((a, b) => a.x - b.x);
        
        ctx.moveTo(rowPoints[0].x, rowPoints[0].y);
        for (let k = 1; k < rowPoints.length; k++) {
          ctx.lineTo(rowPoints[k].x, rowPoints[k].y);
        }
      }
    }
    
    // Draw vertical grid lines
    for (let j = 0; j <= gridResolution; j++) {
      const colPoints = [];
      for (let i = 0; i <= gridResolution; i++) {
        const idx = i * (gridResolution + 1) + j;
        if (idx < projectedPoints.length) {
          colPoints.push(projectedPoints[idx]);
        }
      }
      
      if (colPoints.length > 1) {
        // Sort by y coordinate for smooth line
        colPoints.sort((a, b) => a.y - b.y);
        
        ctx.moveTo(colPoints[0].x, colPoints[0].y);
        for (let k = 1; k < colPoints.length; k++) {
          ctx.lineTo(colPoints[k].x, colPoints[k].y);
        }
      }
    }
    
    ctx.stroke();
    
    // Draw plane center point
    const centerPoint = planePoint.clone();
    const cameraCenterPoint = centerPoint.clone().sub(cameraPosition);
    const rotatedCenterPoint = cameraCenterPoint.clone().applyQuaternion(quaternion);
    
    if (rotatedCenterPoint.z > 0.1) {
      const centerX = (rotatedCenterPoint.x * fx / rotatedCenterPoint.z) + cx;
      const centerY = (rotatedCenterPoint.y * fy / rotatedCenterPoint.z) + cy;
      
      if (centerX >= 0 && centerX < 640 && centerY >= 0 && centerY < 480) {
        ctx.fillStyle = 'rgba(0, 255, 0, 0.8)';
        ctx.beginPath();
        ctx.arc(centerX, centerY, 5, 0, 2 * Math.PI);
        ctx.fill();
      }
    }
  }

  // AR Ruler Measurement System
  class ARRulerSystem {
    constructor() {
      this.startPoint = null;
      this.endPoint = null;
      this.measurementMode = 'placing'; // 'placing', 'measuring', 'complete'
      this.visualizer = null;
      this.ui = null;
      this.camera = null;
      this.alva = null;
      this.raycaster = new THREE.Raycaster();
      this.mouse = new THREE.Vector2();
      this.measurementPlane = null;
      
      // Plane detection properties
      this.detectedPlane = null;
      this.planePoints = [];
      this.usePlaneMode = false;
    }

    initialize(visualizer, ui, camera, alva) {
      this.visualizer = visualizer;
      this.ui = ui;
      this.camera = camera;
      this.alva = alva;
    }

    // RANSAC-based plane detection from 3D points
    detectPlaneRANSAC(points3D, maxIterations = 1000, distanceThreshold = 0.05, minInliers = 50) {
      if (!points3D || points3D.length < 3) {
        return null;
      }

      let bestPlane = null;
      let bestInliers = [];
      let maxInlierCount = 0;

      // Apply coordinate transformation to match the system
      const monocularScaleFactor = MONOCULAR_SCALE_FACTOR;
      const transformedPoints = points3D.map(point3D => new THREE.Vector3(
        point3D.x * monocularScaleFactor,
        -point3D.y * monocularScaleFactor,
        -point3D.z * monocularScaleFactor
      ));

      for (let iteration = 0; iteration < maxIterations; iteration++) {
        // Randomly select 3 points to define a plane
        const indices = [];
        while (indices.length < 3) {
          const idx = Math.floor(Math.random() * transformedPoints.length);
          if (!indices.includes(idx)) {
            indices.push(idx);
          }
        }

        const p1 = transformedPoints[indices[0]];
        const p2 = transformedPoints[indices[1]];
        const p3 = transformedPoints[indices[2]];

        // Calculate plane equation: ax + by + cz + d = 0
        const v1 = p2.clone().sub(p1);
        const v2 = p3.clone().sub(p1);
        const normal = v1.clone().cross(v2).normalize();
        const d = -normal.dot(p1);

        // Count inliers (points close to the plane)
        const inliers = [];
        for (let i = 0; i < transformedPoints.length; i++) {
          const point = transformedPoints[i];
          const distance = Math.abs(normal.dot(point) + d);
          if (distance < distanceThreshold) {
            inliers.push(i);
          }
        }

        // Update best plane if this one has more inliers
        if (inliers.length > maxInlierCount && inliers.length >= minInliers) {
          maxInlierCount = inliers.length;
          bestInliers = inliers;
          bestPlane = {
            normal: normal,
            d: d,
            point: p1.clone(), // A point on the plane
            inliers: inliers.length
          };
        }
      }

      if (bestPlane) {
        console.log(`Plane detected with ${bestPlane.inliers} inliers out of ${transformedPoints.length} points`);
        return bestPlane;
      }

      return null;
    }

    // RANSAC plane detection with raycast constraint
    detectPlaneRANSACWithConstraint(points3D, constraintPoint, maxIterations = 1000, distanceThreshold = 0.05, minInliers = 20) {
      if (!points3D || points3D.length < 3) {
        return null;
      }

      const monocularScaleFactor = MONOCULAR_SCALE_FACTOR;
      const transformedPoints = points3D.map(point3D => new THREE.Vector3(
        point3D.x * monocularScaleFactor,
        -point3D.y * monocularScaleFactor,
        -point3D.z * monocularScaleFactor
      ));

      let bestPlane = null;
      let bestInlierCount = 0;

      for (let i = 0; i < maxIterations; i++) {
        // Randomly select 3 points, but ensure one is close to the constraint point
        let p1, p2, p3;
        
        // First, find a point close to the constraint point
        let closestToConstraint = 0;
        let minDistanceToConstraint = Infinity;
        
        for (let j = 0; j < transformedPoints.length; j++) {
          const distance = transformedPoints[j].distanceTo(constraintPoint);
          if (distance < minDistanceToConstraint) {
            minDistanceToConstraint = distance;
            closestToConstraint = j;
          }
        }
        
        p1 = transformedPoints[closestToConstraint];
        
        // Select two other random points
        const remainingIndices = transformedPoints.map((_, idx) => idx).filter(idx => idx !== closestToConstraint);
        const randomIdx2 = Math.floor(Math.random() * remainingIndices.length);
        const randomIdx3 = Math.floor(Math.random() * remainingIndices.length);
        
        if (randomIdx2 === randomIdx3) continue;
        
        p2 = transformedPoints[remainingIndices[randomIdx2]];
        p3 = transformedPoints[remainingIndices[randomIdx3]];

        // Calculate plane from 3 points
        const v1 = new THREE.Vector3().subVectors(p2, p1);
        const v2 = new THREE.Vector3().subVectors(p3, p1);
        const normal = new THREE.Vector3().crossVectors(v1, v2).normalize();

        if (normal.length() < 0.1) continue; // Skip if points are collinear

        // Calculate plane equation: normal.dot(point) + d = 0
        const d = -normal.dot(p1);

        // Count inliers (points close to the plane)
        const inliers = [];
        for (const point of transformedPoints) {
          const distance = Math.abs(normal.dot(point) + d);
          if (distance < distanceThreshold) {
            inliers.push(point);
          }
        }

        // Check if this is the best plane so far
        if (inliers.length >= minInliers && inliers.length > bestInlierCount) {
          bestInlierCount = inliers.length;
          bestPlane = {
            normal: normal,
            point: p1,
            d: d,
            inliers: inliers
          };
        }
      }

      if (bestPlane) {
        console.log(`Plane detected with ${bestPlane.inliers.length} inliers out of ${transformedPoints.length} points (including raycast constraint)`);
        return bestPlane;
      }

      return null;
    }

    // Manually draw a new plane based on current keyframe points
    drawNewPlane() {
      console.log('=== PLANE DETECTION DEBUG ===');
      
      if (!this.alva || !this.alva.getFramePoints3D) {
        console.log('❌ Cannot draw plane - no 3D points available (alva or getFramePoints3D not found)');
        return false;
      }

      const points3D = this.alva.getFramePoints3D();
      console.log('📊 Total 3D points available:', points3D ? points3D.length : 'null');
      
      if (!points3D || points3D.length < 20) {
        console.log('❌ Cannot draw plane - insufficient 3D points (need at least 20, got ' + (points3D ? points3D.length : 0) + ')');
        return false;
      }

      // Get camera pose for raycast constraint
      const cameraPosition = this.camera.position;
      const cameraDirection = new THREE.Vector3(0, 0, -1);
      cameraDirection.applyQuaternion(this.camera.quaternion);
      
      console.log(`📷 Camera position: (${cameraPosition.x.toFixed(3)}, ${cameraPosition.y.toFixed(3)}, ${cameraPosition.z.toFixed(3)})`);
      console.log(`📷 Camera direction: (${cameraDirection.x.toFixed(3)}, ${cameraDirection.y.toFixed(3)}, ${cameraDirection.z.toFixed(3)})`);

      // Find the nearest 3D point to the raycast line (this will be our constraint point)
      let raycastPoint = null;
      let bestDistance = Infinity;
      
      const monocularScaleFactor = MONOCULAR_SCALE_FACTOR;
      for (const point of points3D) {
        const transformedPoint = new THREE.Vector3(
          point.x * monocularScaleFactor,
          -point.y * monocularScaleFactor,
          -point.z * monocularScaleFactor
        );
        const distance = this.distancePointToRay(cameraPosition, cameraDirection, transformedPoint);
        
        if (distance < bestDistance) {
          bestDistance = distance;
          raycastPoint = transformedPoint;
        }
      }
      
      if (!raycastPoint) {
        console.log('❌ Could not find raycast intersection point');
        return false;
      }
      
      console.log(`🎯 Raycast constraint point: (${raycastPoint.x.toFixed(3)}, ${raycastPoint.y.toFixed(3)}, ${raycastPoint.z.toFixed(3)})`);
      console.log(`📏 Distance to ray: ${bestDistance.toFixed(3)}m`);

      // Analyze point distribution
      if (points3D.length > 0) {
        const monocularScaleFactor = MONOCULAR_SCALE_FACTOR;
        const transformedPoints = points3D.map(point3D => new THREE.Vector3(
          point3D.x * monocularScaleFactor,
          -point3D.y * monocularScaleFactor,
          -point3D.z * monocularScaleFactor
        ));
        
        // Calculate point statistics
        const xCoords = transformedPoints.map(p => p.x);
        const yCoords = transformedPoints.map(p => p.y);
        const zCoords = transformedPoints.map(p => p.z);
        
        const xRange = Math.max(...xCoords) - Math.min(...xCoords);
        const yRange = Math.max(...yCoords) - Math.min(...yCoords);
        const zRange = Math.max(...zCoords) - Math.min(...zCoords);
        
        console.log('📈 Point distribution:');
        console.log('   X range:', xRange.toFixed(2), 'm');
        console.log('   Y range:', yRange.toFixed(2), 'm');
        console.log('   Z range:', zRange.toFixed(2), 'm');
        console.log('   Points span:', Math.sqrt(xRange*xRange + yRange*yRange + zRange*zRange).toFixed(2), 'm');
        
        // Check if points are too close together (might indicate poor detection)
        if (xRange < 0.5 && yRange < 0.5 && zRange < 0.5) {
          console.log('⚠️  Warning: Points are very close together, plane detection may be unreliable');
        }
      }

      // Clear existing plane visualization and state
      this.detectedPlane = null;
      this.usePlaneMode = false;
      this.planePoints = [];
      
      if (this.visualizer) {
        this.visualizer.clearPlaneVisualization();
      }

      // Try multiple RANSAC configurations
      const configs = [
        { maxIterations: 1000, distanceThreshold: 0.05, minInliers: 20 }, // Original
        { maxIterations: 2000, distanceThreshold: 0.1, minInliers: 15 },  // More lenient
        { maxIterations: 5000, distanceThreshold: 0.2, minInliers: 10 },  // Very lenient
        { maxIterations: 1000, distanceThreshold: 0.03, minInliers: 25 }  // Stricter
      ];
      
      for (let i = 0; i < configs.length; i++) {
        const config = configs[i];
        console.log(`🔄 Trying RANSAC config ${i+1}: threshold=${config.distanceThreshold}, minInliers=${config.minInliers}`);
        
        const detectedPlane = this.detectPlaneRANSACWithConstraint(points3D, raycastPoint, config.maxIterations, config.distanceThreshold, config.minInliers);
        if (detectedPlane) {
          this.detectedPlane = detectedPlane;
          this.usePlaneMode = true; // Enable plane mode for marker placement
          
          // Visualize the detected plane
          if (this.visualizer) {
            this.visualizer.createPlaneVisualization(detectedPlane);
          }
          
          console.log('✅ New plane drawn with ' + detectedPlane.inliers.length + ' inliers using config ' + (i+1));
          console.log(`🎯 Plane passes through raycast point: (${raycastPoint.x.toFixed(3)}, ${raycastPoint.y.toFixed(3)}, ${raycastPoint.z.toFixed(3)})`);
          console.log('📐 Plane normal:', detectedPlane.normal);
          console.log('📍 Plane point:', detectedPlane.point);
          return true;
        } else {
          console.log(`❌ Config ${i+1} failed to detect plane`);
        }
      }
      
      console.log('❌ All RANSAC configurations failed to detect a plane');
      console.log('💡 Suggestions:');
      console.log('   - Point camera at a flat surface (floor, wall, table)');
      console.log('   - Ensure good lighting and texture on the surface');
      console.log('   - Move camera closer to the surface');
      console.log('   - Wait for more 3D points to be detected');
      return false;
    }

    // Clear the current plane
    clearPlane() {
      console.log('🗑️ Clearing current plane...');
      
      // Reset plane state
      this.detectedPlane = null;
      this.usePlaneMode = false;
      this.planePoints = [];
      
      // Clear visualization
      if (this.visualizer) {
        this.visualizer.clearPlaneVisualization();
      }
      
      console.log('✅ Plane cleared - markers will be placed on nearest 3D points');
    }

    // Calculate distance from a point to a ray
    distancePointToRay(rayOrigin, rayDirection, point) {
      const toPoint = new THREE.Vector3().subVectors(point, rayOrigin);
      const projectionLength = toPoint.dot(rayDirection);
      const projection = new THREE.Vector3().copy(rayDirection).multiplyScalar(projectionLength);
      const perpendicular = new THREE.Vector3().subVectors(toPoint, projection);
      return perpendicular.length();
    }

    // Intersect ray with plane
    intersectRayWithPlane(rayOrigin, rayDirection, plane) {
      // Plane equation: normal.dot(point) + d = 0
      // Ray equation: point = rayOrigin + t * rayDirection
      // Substitute: normal.dot(rayOrigin + t * rayDirection) + d = 0
      // Solve for t: t = -(normal.dot(rayOrigin) + d) / normal.dot(rayDirection)
      
      const denominator = plane.normal.dot(rayDirection);
      
      // Check if ray is parallel to plane
      if (Math.abs(denominator) < 1e-6) {
        return null; // Ray is parallel to plane
      }
      
      const numerator = -(plane.normal.dot(rayOrigin) + plane.d);
      const t = numerator / denominator;
      
      // Check if intersection is in front of camera
      if (t <= 0.1) {
        return null; // Intersection is behind camera
      }
      
      // Calculate intersection point
      const intersectionPoint = rayOrigin.clone().add(rayDirection.clone().multiplyScalar(t));
      
      return intersectionPoint;
    }

    calculateDistance(startPoint, endPoint) {
      const dx = endPoint.x - startPoint.x;
      const dy = endPoint.y - startPoint.y;
      const dz = endPoint.z - startPoint.z;
      const distance = Math.sqrt(dx*dx + dy*dy + dz*dz);
      
      // MONOCULAR SCALE: The measurements are already in monocular scale
      // No additional scaling needed since we're using monocular pose directly
      return distance;
    }

    // Get camera position and direction from pose matrix
    getCameraTransform(poseMatrix) {
      // Apply AlvaAR coordinate transform for consistency with stereo visualizer
      // This matches the transformation in AlvaARConnectorTHREE: (x, -y, -z) for position
      // MONOCULAR POSE: Use position directly (no scaling needed)
      const position = new THREE.Vector3(poseMatrix[12], -poseMatrix[13], -poseMatrix[14]);
      
      // Extract rotation matrix and apply AlvaARConnectorTHREE transformation
      const rotationMatrix = new THREE.Matrix4().fromArray(poseMatrix);
      const quaternion = new THREE.Quaternion().setFromRotationMatrix(rotationMatrix);
      // Apply AlvaARConnectorTHREE rotation transformation: (-x, y, z, w)
      quaternion.set(-quaternion.x, quaternion.y, quaternion.z, quaternion.w);
      
      // Get forward direction (negative Z axis in camera space)
      const direction = new THREE.Vector3(0, 0, -1);
      direction.applyQuaternion(quaternion);
      
      return { position, direction };
    }

    // Raycast from camera center to find nearest 3D frame point or plane intersection
    raycastToWorld(cameraPosition, cameraDirection, maxDistance = 10.0) {
      // Create a ray from camera position in camera direction
      const rayOrigin = cameraPosition.clone();
      const rayDirection = cameraDirection.clone();
      
      // If plane mode is enabled and we have a detected plane, intersect with plane
      if (this.usePlaneMode && this.detectedPlane) {
        const planeIntersection = this.intersectRayWithPlane(rayOrigin, rayDirection, this.detectedPlane);
        if (planeIntersection) {
          if (window.debugCounter % 30 === 0) {
            console.log('Raycast to plane intersection:', planeIntersection);
          }
          return planeIntersection;
        }
      }
      
      // Fallback to 3D point raycasting
      // Get 3D frame points from SLAM system
      if (!this.alva || !this.alva.getFramePoints3D) {
        // Fallback: point at fixed distance in front of camera
        return cameraPosition.clone().add(cameraDirection.clone().multiplyScalar(2.0));
      }
      
      const points3D = this.alva.getFramePoints3D();
      if (!points3D || points3D.length === 0) {
        // Fallback: point at fixed distance in front of camera
        return cameraPosition.clone().add(cameraDirection.clone().multiplyScalar(2.0));
      }
      
      let bestPoint = null;
      let bestRayDistance = Infinity;
      let bestCameraDistance = Infinity;
      
      // Find the 3D point that is closest to the ray line
      for (const point3D of points3D) {
        // Apply the same coordinate transformation as used for feature points
        const monocularScaleFactor = MONOCULAR_SCALE_FACTOR; // Match the scaling used in visualizeFeaturePoints
        const transformedPoint = new THREE.Vector3(
          point3D.x * monocularScaleFactor, 
          -point3D.y * monocularScaleFactor, 
          -point3D.z * monocularScaleFactor
        );
        
        // Calculate distance from point to ray
        const pointToRayOrigin = transformedPoint.clone().sub(rayOrigin);
        const projectionLength = pointToRayOrigin.dot(rayDirection);
        
        // Only consider points in front of the camera
        if (projectionLength <= 0.1) continue; // At least 10cm in front
        
        // Calculate the closest point on the ray
        const closestPointOnRay = rayOrigin.clone().add(rayDirection.clone().multiplyScalar(projectionLength));
        const distanceToRay = transformedPoint.distanceTo(closestPointOnRay);
        
        // Check if point is within max distance
        if (projectionLength > maxDistance) continue;
        
        // Calculate distance from camera to this point
        const distanceFromCamera = transformedPoint.distanceTo(rayOrigin);
        
        // Selection criteria:
        // 1. Primary: Closest perpendicular distance to ray line
        // 2. Secondary: If multiple points have similar ray distance, choose closest to camera
        const rayDistanceThreshold = 0.1; // 10cm threshold for "on the ray"
        
        let isBetter = false;
        
        if (distanceToRay < bestRayDistance - rayDistanceThreshold) {
          // This point is significantly closer to the ray line
          isBetter = true;
        } else if (Math.abs(distanceToRay - bestRayDistance) <= rayDistanceThreshold) {
          // This point is approximately the same distance from the ray line
          // Choose the one closer to the camera
          if (distanceFromCamera < bestCameraDistance) {
            isBetter = true;
          }
        }
        
        if (isBetter) {
          bestPoint = transformedPoint;
          bestRayDistance = distanceToRay;
          bestCameraDistance = distanceFromCamera;
        }
      }
      
      // Return the best point if found, otherwise fallback
      if (bestPoint && bestRayDistance < MONOCULAR_SCALE_FACTOR) { // Within scale factor distance of ray line
        if (window.debugCounter % 30 === 0) {
          console.log('Raycast to best 3D point:', bestPoint, 
                     'ray distance:', bestRayDistance.toFixed(3), 
                     'camera distance:', bestCameraDistance.toFixed(3));
        }
        return bestPoint;
      }
      
      // Fallback: point at fixed distance in front of camera
      if (window.debugCounter % 30 === 0) {
        console.log('No suitable 3D points found, using fallback at 2m distance');
      }
      return rayOrigin.clone().add(rayDirection.clone().multiplyScalar(2.0));
    }

    // Place marker at world point under crosshair
    placeStartMarker(currentPose) {
      const { position, direction } = this.getCameraTransform(currentPose);
      this.startPoint = this.raycastToWorld(position, direction);
      this.measurementMode = 'measuring';
      
      // Debug logging (reduced frequency to prevent memory leaks)
      if (window.debugCounter % 30 === 0) {
        console.log('Camera position:', position);
        console.log('Camera direction:', direction);
        console.log('Raycast result:', this.startPoint);
      }
      
      if (this.visualizer) {
        this.visualizer.createStartMarker(this.startPoint);
      }
      
      if (this.ui) {
        this.ui.updateStatus('Move camera to end point');
      }
      
      if (window.debugCounter % 30 === 0) {
        console.log('Start marker placed at:', this.startPoint);
      }
    }

    // Place end marker at world point under crosshair
    placeEndMarker(currentPose) {
      const { position, direction } = this.getCameraTransform(currentPose);
      this.endPoint = this.raycastToWorld(position, direction);
      this.measurementMode = 'complete';
      
      if (this.visualizer) {
        this.visualizer.createEndMarker(this.endPoint);
      }
      
      const finalDistance = this.calculateDistance(this.startPoint, this.endPoint)/MONOCULAR_SCALE_FACTOR; //divide by scale factor to get reverse scaled distance
      
      if (this.ui) {
        this.ui.updateDistance(finalDistance); //finalDistance already divided by scale factor
        this.ui.updateStatus('Measurement complete');
      }
      
      if (window.debugCounter % 30 === 0) {
        console.log('End marker placed at:', this.endPoint);
        console.log('Final measurement:', finalDistance.toFixed(3), 'meters');
      }
      
      return finalDistance;
    }

    resetMeasurement() {
      this.startPoint = null;
      this.endPoint = null;
      this.measurementMode = 'placing';
      
      if (this.visualizer) {
        this.visualizer.clearMarkers();
      }
      
      if (this.ui) {
        this.ui.updateDistance(0);
        this.ui.updateStatus('Place start marker');
      }
      
      if (window.debugCounter % 30 === 0) {
        console.log('Measurement reset');
      }
    }

    updateMeasurement(currentPose) {
      if (this.measurementMode === 'measuring' && this.startPoint) {
        const { position, direction } = this.getCameraTransform(currentPose);
        const currentEndPoint = this.raycastToWorld(position, direction);
        const distance = this.calculateDistance(this.startPoint, currentEndPoint);
        
        if (this.ui) {
          this.ui.updateDistance(distance / MONOCULAR_SCALE_FACTOR); //divide by scale factor to get reverse scaled distance
        }
        
        if (this.visualizer) {
          this.visualizer.updateMeasurementLine(this.startPoint, currentEndPoint, distance);
        }
      }
    }
  }

    createEndMarker(position) {

      }

      const material = new THREE.MeshBasicMaterial({

        opacity: 0.8
      });
      this.endMarker = new THREE.Mesh(geometry, material);
      this.endMarker.position.copy(position);
      this.scene.add(this.endMarker);
      
      // Also create marker in 3D scene visualizer
      if (this.sceneVisualizer) {
        if (this.scene3DEndMarker) {
          this.sceneVisualizer.scene.remove(this.scene3DEndMarker);
        }
        
        const scene3DGeometry = new THREE.SphereGeometry(0.1, 16, 16);
        const scene3DMaterial = new THREE.MeshBasicMaterial({ 
          color: 0xff0000,
          transparent: true,
          opacity: 0.9
        });

        this.scene3DEndMarker.position.copy(position);
        this.sceneVisualizer.scene.add(this.scene3DEndMarker);
      }
      
      if (window.debugCounter % 30 === 0) {
        console.log('End marker created at:', position);
      }
    }

    updateMeasurementLine(startPos, endPos, distance) {
      if (this.measurementLine) {
        this.scene.remove(this.measurementLine);
      }
      
      const geometry = new THREE.BufferGeometry().setFromPoints([startPos, endPos]);
      const material = new THREE.LineBasicMaterial({ 
        color: this.getDistanceColor(distance),
        linewidth: 5,
        transparent: true,
        opacity: 0.9
      });
      this.measurementLine = new THREE.Line(geometry, material);
      this.scene.add(this.measurementLine);
      
      // Also create line in 3D scene visualizer
      if (this.sceneVisualizer) {
        if (this.scene3DMeasurementLine) {
          this.sceneVisualizer.scene.remove(this.scene3DMeasurementLine);
        }
        
        const scene3DGeometry = new THREE.BufferGeometry().setFromPoints([startPos, endPos]);
        const scene3DMaterial = new THREE.LineBasicMaterial({ 
          color: this.getDistanceColor(distance),
          linewidth: 3,
          transparent: true,
          opacity: 0.8
        });
        this.scene3DMeasurementLine = new THREE.Line(scene3DGeometry, scene3DMaterial);
        this.sceneVisualizer.scene.add(this.scene3DMeasurementLine);
      }
      
      if (window.debugCounter % 30 === 0) {
        console.log('Measurement line updated:', startPos, 'to', endPos, 'distance:', distance);
      }
    }

    getDistanceColor(distance) {
      if (distance < 1) return 0x00ff00; // Green for close
      if (distance < 3) return 0xffff00; // Yellow for medium
      return 0xff0000; // Red for far
    }

    clearMarkers() {
      if (this.startMarker) {
        this.scene.remove(this.startMarker);
        this.startMarker = null;
      }
      if (this.endMarker) {
        this.scene.remove(this.endMarker);
        this.endMarker = null;
      }
      if (this.measurementLine) {
        this.scene.remove(this.measurementLine);
        this.measurementLine = null;
      }
      
      // Also clear 3D scene visualizer markers
      if (this.sceneVisualizer) {
        if (this.scene3DStartMarker) {
          this.sceneVisualizer.scene.remove(this.scene3DStartMarker);
          this.scene3DStartMarker = null;
        }
        if (this.scene3DEndMarker) {
          this.sceneVisualizer.scene.remove(this.scene3DEndMarker);
          this.scene3DEndMarker = null;
        }
        if (this.scene3DMeasurementLine) {
          this.sceneVisualizer.scene.remove(this.scene3DMeasurementLine);
          this.scene3DMeasurementLine = null;
        }
      }
    }

    // Create plane visualization
    createPlaneVisualization(plane) {
      // Remove existing plane visualization
      this.clearPlaneVisualization();
      
      // Create a large plane mesh to represent the detected plane
      const planeSize = 10; // 10x10 unit plane
      const geometry = new THREE.PlaneGeometry(planeSize, planeSize);
      
      // Create material with transparency for the plane
      const material = new THREE.MeshBasicMaterial({
        color: 0x00ff00, // Green
        transparent: true,
        opacity: 0.2,
        side: THREE.DoubleSide
      });
      
      // Create plane mesh
      this.planeMesh = new THREE.Mesh(geometry, material);
      
      // Create wireframe geometry for the internal grid
      const wireframeGeometry = new THREE.PlaneGeometry(planeSize, planeSize, 20, 20); // 20x20 grid
      const wireframeMaterial = new THREE.LineBasicMaterial({
        color: 0x00ff00, // Green
        transparent: true,
        opacity: 0.8,
        linewidth: 1
      });
      
      // Create wireframe mesh with internal grid lines
      this.planeWireframe = new THREE.WireframeGeometry(wireframeGeometry);
      this.planeWireframeMesh = new THREE.LineSegments(this.planeWireframe, wireframeMaterial);
      
      // Position and orient the plane
      // The plane normal defines the orientation
      const planeNormal = plane.normal.clone();
      const planePoint = plane.point.clone();
      
      // Position both plane and wireframe at the detected point
      this.planeMesh.position.copy(planePoint);
      this.planeWireframeMesh.position.copy(planePoint);
      
      // Orient both to match the detected normal
      // Create a quaternion that rotates the default plane normal (0,0,1) to the detected normal
      const defaultNormal = new THREE.Vector3(0, 0, 1);
      const quaternion = new THREE.Quaternion();
      quaternion.setFromUnitVectors(defaultNormal, planeNormal);
      this.planeMesh.quaternion.copy(quaternion);
      this.planeWireframeMesh.quaternion.copy(quaternion);
      
      // Add both to scene
      this.scene.add(this.planeMesh);
      this.scene.add(this.planeWireframeMesh);
      
      // Also create plane in 3D scene visualizer
      if (this.sceneVisualizer) {
        const scene3DGeometry = new THREE.PlaneGeometry(planeSize, planeSize);
        const scene3DMaterial = new THREE.MeshBasicMaterial({
          color: 0x00ff00,
          transparent: true,
          opacity: 0.15,
          side: THREE.DoubleSide
        });
        
        this.scene3DPlaneMesh = new THREE.Mesh(scene3DGeometry, scene3DMaterial);
        this.scene3DPlaneMesh.position.copy(planePoint);
        this.scene3DPlaneMesh.quaternion.copy(quaternion);
        this.sceneVisualizer.scene.add(this.scene3DPlaneMesh);
        
        // Add wireframe to 3D scene visualizer
        const scene3DWireframeGeometry = new THREE.PlaneGeometry(planeSize, planeSize, 20, 20);
        const scene3DWireframeMaterial = new THREE.LineBasicMaterial({
          color: 0x00ff00,
          transparent: true,
          opacity: 0.6,
          linewidth: 1
        });
        
        this.scene3DPlaneWireframe = new THREE.WireframeGeometry(scene3DWireframeGeometry);
        this.scene3DPlaneWireframeMesh = new THREE.LineSegments(this.scene3DPlaneWireframe, scene3DWireframeMaterial);
        this.scene3DPlaneWireframeMesh.position.copy(planePoint);
        this.scene3DPlaneWireframeMesh.quaternion.copy(quaternion);
        this.sceneVisualizer.scene.add(this.scene3DPlaneWireframeMesh);
      }
      
      console.log('Plane visualization created with normal:', planeNormal, 'at point:', planePoint);
    }

    // Clear plane visualization
    clearPlaneVisualization() {
      console.log('🧹 Clearing plane visualization...');
      
      // Clear main scene plane mesh
      if (this.planeMesh) {
        this.scene.remove(this.planeMesh);
        if (this.planeMesh.geometry) this.planeMesh.geometry.dispose();
        if (this.planeMesh.material) this.planeMesh.material.dispose();
        this.planeMesh = null;
        console.log('✅ Main scene plane mesh cleared');
      }
      
      // Clear main scene wireframe mesh
      if (this.planeWireframeMesh) {
        this.scene.remove(this.planeWireframeMesh);
        if (this.planeWireframe) this.planeWireframe.dispose();
        if (this.planeWireframeMesh.material) this.planeWireframeMesh.material.dispose();
        this.planeWireframeMesh = null;
        this.planeWireframe = null;
        console.log('✅ Main scene wireframe mesh cleared');
      }
      
      // Clear 3D scene plane mesh
      if (this.scene3DPlaneMesh && this.sceneVisualizer) {
        this.sceneVisualizer.scene.remove(this.scene3DPlaneMesh);
        if (this.scene3DPlaneMesh.geometry) this.scene3DPlaneMesh.geometry.dispose();
        if (this.scene3DPlaneMesh.material) this.scene3DPlaneMesh.material.dispose();
        this.scene3DPlaneMesh = null;
        console.log('✅ 3D scene plane mesh cleared');
      }
      
      // Clear 3D scene wireframe mesh
      if (this.scene3DPlaneWireframeMesh && this.sceneVisualizer) {
        this.sceneVisualizer.scene.remove(this.scene3DPlaneWireframeMesh);
        if (this.scene3DPlaneWireframe) this.scene3DPlaneWireframe.dispose();
        if (this.scene3DPlaneWireframeMesh.material) this.scene3DPlaneWireframeMesh.material.dispose();
        this.scene3DPlaneWireframeMesh = null;
        this.scene3DPlaneWireframe = null;
        console.log('✅ 3D scene wireframe mesh cleared');
      }
      
      console.log('🧹 Plane visualization clearing complete');
    }
  }

  // Measurement UI Controller
  class MeasurementUI {
    constructor() {
      this.distanceDisplay = document.getElementById('distance-display');
      this.statusDisplay = document.getElementById('status-display');
      this.startButton = document.getElementById('place-marker');
      this.endButton = document.getElementById('end-measurement');
      this.resetButton = document.getElementById('reset-measurement');
      this.drawPlaneButton = document.getElementById('draw-plane');
      
      this.onStartMarkerRequested = null;
      this.onEndMeasurementRequested = null;
      this.onResetRequested = null;
      this.onDrawPlaneRequested = null;
      this.onClearPlaneRequested = null;
      
      this.setupEventListeners();
    }

    setupEventListeners() {
      this.startButton.addEventListener('click', () => {
        if (this.onStartMarkerRequested) {
          this.onStartMarkerRequested();
        }
      });
      
      this.endButton.addEventListener('click', () => {
        if (this.onEndMeasurementRequested) {
          this.onEndMeasurementRequested();
        }
      });
      
      this.resetButton.addEventListener('click', () => {
        if (this.onResetRequested) {
          this.onResetRequested();
        }
      });
      
      this.drawPlaneButton.addEventListener('click', () => {
        if (this.drawPlaneButton.classList.contains('plane-active')) {
          // Clear existing plane
          if (this.onClearPlaneRequested) {
            this.onClearPlaneRequested();
            this.resetDrawPlaneButton();
          }
        } else {
          // Draw new plane
          if (this.onDrawPlaneRequested) {
            const success = this.onDrawPlaneRequested();
            this.updateDrawPlaneButton(success);
          }
        }
      });
    }

    updateDistance(distance) {
      this.distanceDisplay.textContent = `${distance.toFixed(3)} meters`;
    }

    updateStatus(status) {
      if (this.statusDisplay) {
        this.statusDisplay.textContent = status;
      }
    }

    updateDrawPlaneButton(success) {
      if (success) {
        this.drawPlaneButton.textContent = 'Clear Plane';
        this.drawPlaneButton.style.background = '#28a745';
        this.drawPlaneButton.classList.add('plane-active');
      } else {
        this.drawPlaneButton.textContent = 'Failed ✗';
        this.drawPlaneButton.style.background = '#dc3545';
        // Reset after 1 second instead of 2
        setTimeout(() => {
          this.resetDrawPlaneButton();
        }, 1000);
      }
    }

    resetDrawPlaneButton() {
      this.drawPlaneButton.textContent = 'Draw Plane';
      this.drawPlaneButton.style.background = '#007bff';
      this.drawPlaneButton.classList.remove('plane-active');
    }
  }

      // Function to update the 3D scene visualizer - simplified like stereo visualizer
      function updateSceneVisualizer(pose) {
        if (!sceneVisualizer || !view) return;
        
        // MONOCULAR POSE: Use pose directly (no scaling needed)
        // The monocular SLAM pose is already at the correct scale for Three.js
        view.updateCameraPose(pose);
        
        // Debug: Log detailed coordinate information (only occasionally to prevent memory leaks)
        if (window.debugCounter === undefined) window.debugCounter = 0;
        window.debugCounter++;
        if (window.debugCounter % 60 === 0) { // Log every 60 frames (2 seconds at 30fps)
          console.log('=== MONOCULAR POSE DEBUG (Frame ' + window.debugCounter + ') ===');
          if (pose.length === 16) {
            console.log('Monocular pose (direct):', {x: pose[12].toFixed(3), y: pose[13].toFixed(3), z: pose[14].toFixed(3)});
          }
          console.log('Camera position:', view.camera.position);
          console.log('Using monocular SLAM pose directly (no scaling)');
        }
        
        // CRITICAL FIX: The monocular SLAM is initialized with ZERO distortion parameters
        // while stereo triangulation uses correct distortion. This causes pose drift.
        // We need to use a much more aggressive approach to prevent this mismatch.
        
        if (window.lastValidPose) {
          const currentTranslation = new THREE.Vector3(pose[12], -pose[13], -pose[14]);
          const lastTranslation = new THREE.Vector3(window.lastValidPose[12], -window.lastValidPose[13], -window.lastValidPose[14]);
          const translationDiff = currentTranslation.distanceTo(lastTranslation);
          
          // Calculate rotation difference
          const currentMatrix = new THREE.Matrix4().fromArray(pose);
          const lastMatrix = new THREE.Matrix4().fromArray(window.lastValidPose);
          const currentQuat = new THREE.Quaternion().setFromRotationMatrix(currentMatrix);
          const lastQuat = new THREE.Quaternion().setFromRotationMatrix(lastMatrix);
          const rotationDiff = Math.abs(currentQuat.dot(lastQuat));
          
          // EXTREMELY CONSERVATIVE CONSTRAINTS due to distortion mismatch
          const maxTranslationPerFrame = 0.02; // 2cm per frame (extremely conservative)
          const minRotationSimilarity = 0.995; // Almost no rotation changes allowed
          
          // If movement is too large, heavily constrain it
          if (translationDiff > maxTranslationPerFrame || rotationDiff < minRotationSimilarity) {
            console.warn(`DISTORTION MISMATCH: Unrealistic camera movement! Translation: ${translationDiff.toFixed(3)}m, Rotation similarity: ${rotationDiff.toFixed(3)}`);
            
            // Apply EXTREMELY strong smoothing to prevent wild movement
            const smoothingFactor = 0.02; // 98% previous pose, 2% new pose
            const constrainedPose = [...pose];
            
            // Constrain translation
            constrainedPose[12] = window.lastValidPose[12] * (1 - smoothingFactor) + pose[12] * smoothingFactor;
            constrainedPose[13] = window.lastValidPose[13] * (1 - smoothingFactor) + pose[13] * smoothingFactor;
            constrainedPose[14] = window.lastValidPose[14] * (1 - smoothingFactor) + pose[14] * smoothingFactor;
            
            // Constrain rotation
            for (let i = 0; i < 12; i++) {
              constrainedPose[i] = window.lastValidPose[i] * (1 - smoothingFactor) + pose[i] * smoothingFactor;
            }
            
            pose = constrainedPose;
          }
          
          // Update last valid pose
          window.lastValidPose = [...pose];
        } else {
          // Initialize tracking variables
          window.lastValidPose = [...pose];
        }
        
        // Ensure camera helper is visible, scaled, and colored red when pose is detected
        if (sceneVisualizer.camHelper) {
          sceneVisualizer.camHelper.visible = true;
          if (sceneVisualizer.camHelper.scale.x !== 1) {
            sceneVisualizer.camHelper.scale.set(1, 1, 1);
          }
          if (sceneVisualizer.camHelper.material.color.getHex() !== 0xff0000) {
            sceneVisualizer.camHelper.material.color.setHex(0xff0000);
            sceneVisualizer.camHelper.material.needsUpdate = true;
          }
        }
        
        // Update status label
        if (sceneVisualizer.statusLabel) {
          const statusCanvas = sceneVisualizer.statusLabel.material.map.image;
          const statusContext = statusCanvas.getContext('2d');
          statusContext.clearRect(0, 0, statusCanvas.width, statusCanvas.height);
          statusContext.fillStyle = '#00aa00';
          statusContext.font = 'Bold 20px Arial';
          statusContext.textAlign = 'center';
          statusContext.fillText('TRACKING', 128, 32);
          statusContext.fillText('ACTIVE', 128, 56);
          sceneVisualizer.statusLabel.material.map.needsUpdate = true;
        }
        
        // Debug: Log detailed coordinate information (only occasionally to prevent memory leaks)
        if (window.debugCounter === undefined) window.debugCounter = 0;
        window.debugCounter++;
        if (window.debugCounter % 60 === 0) { // Log every 60 frames (2 seconds at 30fps)
          console.log('=== COORDINATE DEBUG (Frame ' + window.debugCounter + ') ===');
          if (pose.length === 16) {
            console.log('Pose matrix translation (raw):', {x: pose[12], y: pose[13], z: pose[14]});
          }
          console.log('Camera position:', view.camera.position);
        }
        
        // CAMERA MOVEMENT CONSTRAINTS: Limit camera movement to realistic bounds
        if (window.lastValidPose) {
          const currentTranslation = new THREE.Vector3(pose[12], -pose[13], -pose[14]);
          const lastTranslation = new THREE.Vector3(window.lastValidPose[12], -window.lastValidPose[13], -window.lastValidPose[14]);
          const translationDiff = currentTranslation.distanceTo(lastTranslation);
          
          // Calculate rotation difference
          const currentMatrix = new THREE.Matrix4().fromArray(pose);
          const lastMatrix = new THREE.Matrix4().fromArray(window.lastValidPose);
          const currentQuat = new THREE.Quaternion().setFromRotationMatrix(currentMatrix);
          const lastQuat = new THREE.Quaternion().setFromRotationMatrix(lastMatrix);
          const rotationDiff = Math.abs(currentQuat.dot(lastQuat));
          
          // REALISTIC CONSTRAINTS: Based on typical human camera movement
          const maxTranslationPerFrame = 0.1; // 10cm per frame (conservative)
          const minRotationSimilarity = 0.98; // Small rotation changes allowed
          
          // If movement is too large, constrain it
          if (translationDiff > maxTranslationPerFrame || rotationDiff < minRotationSimilarity) {
            console.warn(`Unrealistic camera movement detected! Translation: ${translationDiff.toFixed(3)}m, Rotation similarity: ${rotationDiff.toFixed(3)}`);
            
            // Apply smoothing to prevent wild movement
            const smoothingFactor = 0.3; // 70% previous pose, 30% new pose
            const constrainedPose = [...pose];
            
            // Constrain translation
            constrainedPose[12] = window.lastValidPose[12] * (1 - smoothingFactor) + pose[12] * smoothingFactor;
            constrainedPose[13] = window.lastValidPose[13] * (1 - smoothingFactor) + pose[13] * smoothingFactor;
            constrainedPose[14] = window.lastValidPose[14] * (1 - smoothingFactor) + pose[14] * smoothingFactor;
            
            // Constrain rotation
            for (let i = 0; i < 12; i++) {
              constrainedPose[i] = window.lastValidPose[i] * (1 - smoothingFactor) + pose[i] * smoothingFactor;
            }
            
            pose = constrainedPose;
            // Re-apply the constrained pose to the camera
            view.updateCameraPose(pose);
          }
          
          // Update last valid pose
          window.lastValidPose = [...pose];
        } else {
          // Initialize tracking variables
          window.lastValidPose = [...pose];
        }
        
        // Visualize 3D feature points
        visualizeFeaturePoints();
      }
      
      // Function to visualize 3D feature points from SLAM
      function visualizeFeaturePoints() {
        if (!sceneVisualizer || !alva.getFramePoints3D) return;
        
        // Get 3D points from SLAM system
        const points3D = alva.getFramePoints3D();
        if (!points3D || points3D.length === 0) return;

          console.log('Number of feature points:', points3D.length);
        }
        
        // Clear previous feature points and dispose of Three.js resources
        if (sceneVisualizer.featurePoints) {
          sceneVisualizer.featurePoints.forEach(point => {
            sceneVisualizer.scene.remove(point);
            // Dispose of geometry and material to prevent memory leaks
            if (point.geometry) point.geometry.dispose();
            if (point.material) point.material.dispose();
          });
        }
        sceneVisualizer.featurePoints = [];
        
        // Create shared geometry and material to reduce memory usage
        if (!sceneVisualizer.featureGeometry) { // FEATURE POINT SIZE
          //sceneVisualizer.featureGeometry = new THREE.SphereGeometry(0.2, 8, 8); // Increased from 0.02 to 0.05
          sceneVisualizer.featureGeometry = new THREE.SphereGeometry(0.004*MONOCULAR_SCALE_FACTOR, 8, 8); // Increased from 0.02 to 0.05
        }
        if (!sceneVisualizer.featureMaterial) {
          sceneVisualizer.featureMaterial = new THREE.MeshBasicMaterial({ 
            color: 0xff6600,
            transparent: true,
            opacity: 0.8
          });
        }
        
        // Create new feature points (limit to avoid performance issues)
        const maxPoints = Math.min(points3D.length, 200);
        for (let i = 0; i < maxPoints; i++) {
          const point3D = points3D[i];
          
          // Create sphere using shared geometry and material
          const sphere = new THREE.Mesh(sceneVisualizer.featureGeometry, sceneVisualizer.featureMaterial);
          // Apply the SAME coordinate transformation as the camera to maintain consistency
          // This matches the transformation in AlvaARConnectorTHREE: (x, -y, -z)
          // SCALE feature points to match monocular pose scale
          // Feature points come from stereo triangulation (metric scale) but need to match monocular pose scale
          const monocularScaleFactor = MONOCULAR_SCALE_FACTOR; // Adjust this based on monocular drift - stereo points are much larger than monocular pose
          sphere.position.set(point3D.x * monocularScaleFactor, -point3D.y * monocularScaleFactor, -point3D.z * monocularScaleFactor);
          
          sceneVisualizer.scene.add(sphere);
          sceneVisualizer.featurePoints.push(sphere);
        }
      }

      function render() {
        stats.next();
        stats.start('total');

                 const spacing = 0;
         const boxWidth = 640;
         const boxHeight = 480;
         const width = 640 * 2 + spacing;
         const height = 480;
         $canvas.width = width;
         $canvas.height = height;
        const ctx = $canvas.getContext('2d');
        ctx.clearRect(0, 0, $canvas.width, $canvas.height);

        let frameLeft = null;

        let pose = null;

          if (!frameLeft || !frameRight || !frameLeft.data.length || !frameRight.data.length) {

            return;
          }

          if (frameLeft && frameRight) {
            stats.start('video');
            
                         ctx.putImageData(frameLeft, 0, 0);
             ctx.putImageData(frameRight, 640 + spacing, 0);
            
            stats.stop('video');
            stats.start('slam');
            
            if (frameLeft && frameRight && frameLeft.data.length && frameRight.data.length) {
              if (firstFrame) {
                alva.reset();  // Reset LK tracker on first valid frame
                firstFrame = false;
              }
              pose = alva.findStereoCameraPose(frameLeft, frameRight);
            }
            stats.stop('slam');
            
            if (pose) {
              latestPose = pose;
              
              // Use the standard ARSimpleView updateCameraPose method like stereo visualizer
              view.updateCameraPose(pose);
              
              // Update AR Ruler measurement
              arRulerSystem.updateMeasurement(pose);
              
              // Update 3D point count in status
              if (arRulerSystem && arRulerSystem.alva && arRulerSystem.alva.getFramePoints3D) {
                const points3D = arRulerSystem.alva.getFramePoints3D();
                const pointCount = points3D ? points3D.length : 0;
                if (pointCount > 0 && window.debugCounter % 60 === 0) {
                  console.log(`📊 Current 3D points: ${pointCount} (need 20+ for plane detection)`);
                }
              }
              
              // Update 3D Scene Visualizer
              updateSceneVisualizer(pose);
            } else {
              view.lostCamera();
            }

            // Draw 3D stereo frame points projected onto left camera
            if (pose && alva.getFramePoints3D) {
              const points3D = alva.getFramePoints3D();
              if (points3D && points3D.length > 0) {
                // Use parsed calibration data from YAML file
                let fx = 525, fy = 525, cx = 320, cy = 240; // Default fallback values
                
                if (leftCameraIntrinsics) {
                  fx = leftCameraIntrinsics.fx;
                  fy = leftCameraIntrinsics.fy;
                  cx = leftCameraIntrinsics.cx;
                  cy = leftCameraIntrinsics.cy;
                } else {
                  // Fallback: try to get from WASM module if YAML parsing failed
                  if (typeof ModuleInstance.getLeftCameraIntrinsics === 'function') {
                    try {
                      const intrinsics = ModuleInstance.getLeftCameraIntrinsics();
                      if (intrinsics && intrinsics.length >= 4) {
                        fx = intrinsics[0];
                        fy = intrinsics[1];
                        cx = intrinsics[2];
                        cy = intrinsics[3];
                      }
                    } catch (e) {
                      console.log('Could not get camera intrinsics from module, using defaults');
                    }
                  }
                }
                
                // Debug: Log calibration info occasionally
                if (window.debugCounter % 120 === 0) {
                  console.log('Using camera intrinsics from YAML:', {fx, fy, cx, cy});
                  console.log('Projecting', points3D.length, '3D points to 2D');
                }
                
                for (const point3D of points3D) {
                  // Project 3D point to 2D image coordinates using pinhole camera model
                  // Note: points3D are in stereo coordinate system, need to project to left camera
                  const x = (point3D.x * fx / point3D.z) + cx;
                  const y = (point3D.y * fy / point3D.z) + cy;
                  
                  // Only draw points that are in front of camera and within image bounds
                  if (point3D.z > 0.1 && x >= 0 && x < 640 && y >= 0 && y < 480) {
                    // Color based on depth (closer = brighter, farther = darker)
                    const depth = Math.min(point3D.z / 5.0, 1.0); // Normalize depth to 0-1 (5m max)
                    const intensity = Math.floor(255 * (1.0 - depth)); // Closer points are brighter
                    
                    // Use different colors for different depth ranges
                    if (point3D.z < 1.0) {
                      ctx.fillStyle = `rgb(255, ${intensity}, ${intensity})`; // Red for very close
                    } else if (point3D.z < 2.0) {
                      ctx.fillStyle = `rgb(${intensity}, 255, ${intensity})`; // Green for close
                    } else {
                      ctx.fillStyle = `rgb(${intensity}, ${intensity}, 255)`; // Blue for far
                    }
                    
                    // Size based on depth (closer = larger)
                    const size = Math.max(1, Math.floor(4 * (1.0 - depth)));
                    ctx.fillRect(x - size/2, y - size/2, size, size);
                  }
                }
              }
            } else {
              // Fallback to original 2D keypoints if 3D points not available
              const dots = alva.getFramePoints();
              for (const p of dots) {
                ctx.fillStyle = 'white';
                ctx.fillRect(p.x, p.y, 2, 2);
              }
            }

            // Draw detected plane outline on left frame if plane mode is enabled
            if (arRulerSystem && arRulerSystem.usePlaneMode && arRulerSystem.detectedPlane && pose) {
              drawPlaneOutlineOnFrame(ctx, arRulerSystem.detectedPlane, pose, leftCameraIntrinsics);
            }
                     } else if (frameLeft) {
             ctx.putImageData(frameLeft, 0, 0);
             ctx.fillStyle = "rgba(0,0,0,0.6)";
             ctx.fillRect(0, 0, 110, 25);
             ctx.fillStyle = "white";
             ctx.font = "16px Helvetica";
             ctx.fillText("Left Camera", 10, 18);
           }
           if (frameRight) {
             ctx.putImageData(frameRight, 640, 0);
             ctx.fillStyle = "rgba(0,0,0,0.6)";
             ctx.fillRect(640, 0, 120, 25);
             ctx.fillStyle = "white";
             ctx.font = "16px Helvetica";
             ctx.fillText("Right Camera", 650, 18);
           }
           ctx.beginPath();
           ctx.moveTo(640, 0);
           ctx.lineTo(640, 480);
           ctx.strokeStyle = "#333";
           ctx.lineWidth = 2;
           ctx.stroke();
        }
        stats.stop('total');
        stats.render();
        requestAnimationFrame(render);
      }
      render();
    }

      }, { once: true });

  }

  window.addEventListener('load', main);
</script>
