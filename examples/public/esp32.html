<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,shrink-to-fit=no" name="viewport"/>
  <meta content="IE=edge" http-equiv="X-UA-Compatible"/>
  <title>AlvaAR Camera (ROS2)</title>
  <link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgo=">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      font-family: 'Helvetica', sans-serif;
      overflow: hidden;
      background: #000;
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #container {
      position: relative;
      width: 100%;
      height: 100%;
      display: block;
      overflow: hidden;
      line-height: 0;
    }

    #container > * {
      position: absolute;
      display: block;
      user-select: none;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      animation: fadeIn 1.2s;
    }

    canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
    }

    #splash {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      opacity: 1;
    }

    #overlay {
      position: absolute;
      font-size: 16px;
      z-index: 2;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: rgba(0, 0, 0, 0.5);
    }

    #overlay::before {
      position: absolute;
      width: 100%;
      white-space: pre-wrap;
      content: "Waiting for ROS2 camera stream \A (topic: /stereo/left/rectified_images)";
      top: calc(50% + 50px);
      text-align: center;
      color: #949494;
    }

    #overlay button {
      background: transparent;
      border: 1px solid rgb(255, 255, 255);
      border-radius: 4px;
      color: #ffffff;
      padding: 12px 18px;
      text-transform: uppercase;
      cursor: pointer;
    }

    @keyframes fadeIn {
      0% { opacity: 0; }
      50% { opacity: 0.6; }
      100% { opacity: 1; }
    }

    @media screen and (max-device-width: 480px) and (orientation: landscape) {
      #container { display: none; }
      body::before {
        content: "Rotate device to portrait mode.";
        color: white;
      }
    }

    @media screen and (max-device-width: 480px) and (orientation: portrait) {
      #container { display: block; }
      body::before { content: none; }
    }
  </style>
</head>
<body>
<div id="container"></div>
<div id="overlay">
  <button id="start_button">Start</button>
  <div id="splash"></div>
</div>

<!-- ROS Bridge -->
<script src="https://cdn.jsdelivr.net/npm/roslib/build/roslib.min.js"></script>

<!-- Module Scripts -->
<script type="module">
  import { Stats } from "./assets/stats.js";
  import { AlvaAR } from './assets/alva_ar.js';
  import { ARCamView } from "./assets/view.js";
  import { onFrame } from "./assets/utils.js";

  function connectROSImage(callback) {
    const ros = new ROSLIB.Ros({ url: 'ws://localhost:9090' });

    ros.on('connection', () => console.log('Connected to ROS'));
    ros.on('error', err => console.error('Error connecting to ROS:', err));
    ros.on('close', () => console.warn('Connection to ROS closed'));

    const imageListener = new ROSLIB.Topic({
      ros: ros,
      name: '/stereo/left/rectified_images',
      messageType: 'sensor_msgs/msg/CompressedImage'
    });

    imageListener.subscribe(message => {
      const base64Data = 'data:image/jpeg;base64,' + btoa(
        String.fromCharCode(...new Uint8Array(message.data))
      );
      callback(base64Data);
    });
  }

  function main() {
    const $container = document.getElementById('container');
    const $view = document.createElement('div');
    const $canvas = document.createElement('canvas');
    const $overlay = document.getElementById('overlay');
    const $start = document.getElementById('start_button');
    const $splash = document.getElementById('splash');
    const splashFadeTime = 800;

    $splash.style.transition = `opacity ${splashFadeTime / 1000}s ease`;
    $splash.style.opacity = 0;

    async function demoROS() {
      $canvas.width = $container.clientWidth;
      $canvas.height = $container.clientHeight;

      const ctx = $canvas.getContext('2d', { alpha: false, desynchronized: true });
      const alva = await AlvaAR.Initialize($canvas.width, $canvas.height);
      const view = new ARCamView($view, $canvas.width, $canvas.height);

      Stats.add('total');
      Stats.add('video');
      Stats.add('slam');

      $container.appendChild($canvas);
      $container.appendChild($view);
      document.body.appendChild(Stats.el);
      document.body.addEventListener("click", () => alva.reset(), false);

      const $img = new Image();

      connectROSImage(src => {
        $img.src = src;
      });

      onFrame(() => {
        Stats.next();
        Stats.start('total');

        ctx.clearRect(0, 0, $canvas.width, $canvas.height);

        if (!document.hidden && $img.complete) {
          Stats.start('video');
          ctx.drawImage($img, 0, 0, $canvas.width, $canvas.height);
          const frame = ctx.getImageData(0, 0, $canvas.width, $canvas.height);
          Stats.stop('video');

          Stats.start('slam');
          const pose = alva.findCameraPose(frame);
          Stats.stop('slam');

          if (pose) {
            view.updateCameraPose(pose);
          } else {
            view.lostCamera();
            const dots = alva.getFramePoints();
            for (const p of dots) {
              ctx.fillStyle = 'white';
              ctx.fillRect(p.x, p.y, 2, 2);
            }
          }
        }

        Stats.stop('total');
        Stats.render();
        return true;
      }, 30);
    }

    setTimeout(() => {
      $splash.remove();
      $start.addEventListener('click', () => {
        $overlay.remove();
        demoROS();
      }, { once: true });
    }, splashFadeTime);
  }

  window.addEventListener('load', main);
</script>
</body>
</html>
