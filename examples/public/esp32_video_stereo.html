<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,shrink-to-fit=no" name="viewport"/>
  <meta content="IE=edge" http-equiv="X-UA-Compatible"/>
  <title>Stereo Video ESP32</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      font-family: 'Helvetica', sans-serif;
      overflow: hidden;
      background: #000;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #container {
      position: relative;
      width: 960px;
      height: 320px;
      overflow: hidden;
      line-height: 0;
      border: 2px solid #333;
      box-shadow: 0 0 10px #000;
    }

    #container > * {
      position: absolute;
      display: block;
      user-select: none;
      top: 0;
      left: 0;
      width: 960px;
      height: 320px;
      animation: fadeIn 1.2s;
    }

    canvas {
      display: block;
      width: 960px;
      height: 320px;
    }

    #splash {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      opacity: 1;
    }

    #overlay {
      position: absolute;
      font-size: 16px;
      z-index: 2;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: rgba(0, 0, 0, 0.5);
    }

    #overlay::before {
      position: absolute;
      width: 100%;
      white-space: pre-wrap;
      content: "Waiting for ROS2 camera stream \A (topics: /stereo/left/rectified_images/compressed) \A (topics: /stereo/right/rectified_images/compressed)";
      top: calc(50% + 50px);
      text-align: center;
      color: #949494;
    }

    #overlay button {
      background: transparent;
      border: 1px solid white;
      border-radius: 4px;
      color: white;
      padding: 12px 18px;
      text-transform: uppercase;
      cursor: pointer;
    }

    @keyframes fadeIn {
      0% { opacity: 0; }
      50% { opacity: 0.6; }
      100% { opacity: 1; }
    }

    @media screen and (max-device-width: 480px) and (orientation: landscape) {
      #container { display: none; }
      body::before {
        content: "Rotate device to portrait mode.";
        color: white;
      }
    }

    @media screen and (max-device-width: 480px) and (orientation: portrait) {
      #container { display: block; }
      body::before { content: none; }
    }
  </style>
</head>
<body>
<div id="container"></div>
<div id="overlay">
  <button id="start_button">Start</button>
  <div id="splash"></div>
</div>

<script type="module">
  import Module from './assets/alva_ar.js';
  import { Stats } from './assets/stats.js';
  import { ARCamView } from './assets/view.js';
  import { Video } from './assets/utils.js'; // Added for video loading

  async function waitForEmscriptenModule(ModuleInstance) {
    return new Promise(resolve => {
      if (ModuleInstance && ModuleInstance.calledRun) {
        resolve();
      } else if (ModuleInstance && typeof ModuleInstance.onRuntimeInitialized === 'function') {
        ModuleInstance.onRuntimeInitialized = resolve;
      } else {
        const check = setInterval(() => {
          if (ModuleInstance && ModuleInstance.calledRun) {
            clearInterval(check);
            resolve();
          }
        }, 50);
      }
    });
  }

  async function main() {
    const $container = document.getElementById('container');
    const $view = document.createElement('div');
    const $canvas = document.createElement('canvas');
    const $overlay = document.getElementById('overlay');
    const $start = document.getElementById('start_button');
    const $splash = document.getElementById('splash');
    const splashFadeTime = 800;

    let alva, view, stats;
    let mediaLeft, mediaRight;

    async function demoStream() {
      const ModuleInstance = await Module();
      await waitForEmscriptenModule(ModuleInstance);

      // Fetch stereo calibration
      const yamlResponse = await fetch('./assets/stereo_camera.yaml');
      const yamlText = await yamlResponse.text();
      if (typeof ModuleInstance.setStereoCalibrationYAML === 'function') {
        ModuleInstance.setStereoCalibrationYAML(yamlText);
      } else {
        console.error('setStereoCalibrationYAML is not available on the Module instance.');
      }

      const leftPtr = ModuleInstance._malloc(480 * 320 * 4);
      const rightPtr = ModuleInstance._malloc(480 * 320 * 4);
      window.addEventListener('unload', () => {
        ModuleInstance._free(leftPtr);
        ModuleInstance._free(rightPtr);
      });

      alva = {
        findStereoCameraPose(leftFrame, rightFrame) {
          if (!ModuleInstance || typeof ModuleInstance.findStereoCameraPose !== 'function') {
            console.error('Emscripten Module or findStereoCameraPose not loaded');
            return null;
          }
          ModuleInstance.HEAPU8.set(leftFrame.data, leftPtr);
          ModuleInstance.HEAPU8.set(rightFrame.data, rightPtr);
          const posePtr = ModuleInstance._malloc(16 * 4);
          const ok = ModuleInstance.findStereoCameraPose(leftPtr, rightPtr, posePtr);
          let pose = null;  
          if (ok) {
            pose = new Float32Array(ModuleInstance.HEAPF32.buffer, posePtr, 16).slice();
          }
          ModuleInstance._free(posePtr);
          return pose;
        },
        reset() {
          if (typeof ModuleInstance.reset === 'function') {
            ModuleInstance.reset();
          }
        },
        getFramePoints() {
          if (typeof ModuleInstance.getStereoFramePoints === 'function') {
            const n = 4096;
            const buf = ModuleInstance._malloc(n * 4 * 2);
            const numPoints = ModuleInstance.getStereoFramePoints(buf);
            const arr = new Int32Array(ModuleInstance.HEAP32.buffer, buf, numPoints * 2);
            const result = [];
            for (let i = 0; i < numPoints; ++i) {
              result.push({ x: arr[i * 2], y: arr[i * 2 + 1] });
            }
            ModuleInstance._free(buf);
            return result;
          }
          return [];
        }
      };

      // Load videos instead of WebSocket stream
      mediaLeft = await Video.Initialize('./assets/left_web1.mp4');
      mediaRight = await Video.Initialize('./assets/right_web1.mp4');
      mediaLeft.el.play();
      mediaLeft.el.loop = true;
      mediaRight.el.play();
      mediaRight.el.loop = true;

      // Overlay
      $view.style.position = 'absolute';
      $view.style.left = '0px';
      $view.style.top = '0px';
      $view.style.width = '480px';
      $view.style.height = '320px';
      $view.style.zIndex = '10';

      view = new ARCamView($view, 480, 320, 0, 0, -8);

      stats = Stats;
      stats.add('total');
      stats.add('video');
      stats.add('slam');

      $container.appendChild($canvas);
      $container.appendChild($view);
      document.body.appendChild(stats.el);

      document.body.addEventListener("click", () => alva.reset(), false);

      let firstFrame = true;

      function render() {
        stats.next();
        stats.start('total');

        const spacing = 0;
        const width = 480 * 2 + spacing;
        const height = 320;
        $canvas.width = width;
        $canvas.height = height;
        const ctx = $canvas.getContext('2d');
        // ctx.clearRect(0, 0, width, height);
        ctx.clearRect(0, 0, $canvas.width, $canvas.height);

        let frameLeft = null;
        let frameRight = null;
        let pose = null;

        if (!document.hidden) {
          frameLeft = mediaLeft.getImageData();
          frameRight = mediaRight.getImageData();

         if (!frameLeft || !frameRight || !frameLeft.data.length || !frameRight.data.length) {
              requestAnimationFrame(render);
              return;
          }

          if (frameLeft && frameRight) {
          stats.start('video');
        
          ctx.putImageData(frameLeft, 0, 0);
          ctx.putImageData(frameRight, 480 + spacing, 0);
          
          stats.stop('video');

          stats.start('slam');
          if (frameLeft && frameRight && frameLeft.data.length && frameRight.data.length) {
              if (firstFrame) {
                  alva.reset();  // Reset LK tracker on first valid frame
                  firstFrame = false;
              }
              pose = alva.findStereoCameraPose(frameLeft, frameRight);
          }
          else {
            requestAnimationFrame(render);
            return;
          }
          stats.stop('slam');

          if (pose) {
            view.updateCameraPose(pose);
          } else {
            view.lostCamera();
            const dots = alva.getFramePoints();
            for (const p of dots) {
              ctx.fillStyle = 'white';
              ctx.fillRect(p.x, p.y, 2, 2);
            }
          }

          // Labels
          ctx.fillStyle = "rgba(0,0,0,0.6)";
          ctx.fillRect(0, 0, 170, 25);
          ctx.fillStyle = "white";
          ctx.font = "16px Helvetica";
          ctx.fillText("Left Camera (Stereo)", 10, 18);

          ctx.fillStyle = "rgba(0,0,0,0.6)";
          ctx.fillRect(480, 0, 120, 25);
          ctx.fillStyle = "white";
          ctx.fillText("Right Camera", 490, 18);
        } else if (frameLeft) {
            ctx.putImageData(frameLeft, 0, 0);
            ctx.fillStyle = "rgba(0,0,0,0.6)";
            ctx.fillRect(0, 0, 110, 25);
            ctx.fillStyle = "white";
            ctx.font = "16px Helvetica";
            ctx.fillText("Left Camera (Stereo)", 10, 18);
          }
          if (frameRight) {
            ctx.putImageData(frameRight, 480 + spacing, 0);
            ctx.fillStyle = "rgba(0,0,0,0.6)";
            ctx.fillRect(480, 0, 120, 25);
            ctx.fillStyle = "white";
            ctx.font = "16px Helvetica";
            ctx.fillText("Right Camera", 490, 18);
          }
          ctx.beginPath();
          ctx.moveTo(480, 0);
          ctx.lineTo(480, 320);
          ctx.strokeStyle = "#333";
          ctx.lineWidth = 2;
          ctx.stroke();
        }
        stats.stop('total');
        stats.render();
        requestAnimationFrame(render);
      }
      render();
    }

    setTimeout(() => {
      $splash.remove();
      $start.addEventListener('click', () => {
        $overlay.remove();
        demoStream();
      }, { once: true });
    }, splashFadeTime);
  }

  window.addEventListener('load', main);
</script>
</body>
</html>
