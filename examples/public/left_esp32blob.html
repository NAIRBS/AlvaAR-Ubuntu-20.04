<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,shrink-to-fit=no" name="viewport"/>
  <meta content="IE=edge" http-equiv="X-UA-Compatible"/>
  <title>AlvaAR Camera (ROS2)</title>
  <link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgo=">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      /* font-family: 'Helvetica', sans-serif;
      overflow: hidden;
      background: #000;
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center; */
      font-family: 'Helvetica', sans-serif;
      overflow: hidden;
      background: #000;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #container {
      /* position: relative;
      width: 100%;
      height: 100%;
      display: block;
      overflow: hidden;
      line-height: 0; */
      position: relative;
      width: 480px;
      height: 320px;
      overflow: hidden;
      line-height: 0;
      border: 1px solid #333;
      box-shadow: 0 0 10px #000;
    }

    #container > * {
      position: absolute;
      display: block;
      user-select: none;
      top: 0;
      left: 0;
      /* width: 100%;
      height: 100%; */
      width: 480px;
      height: 320px;
      animation: fadeIn 1.2s;
    }

    canvas {
      display: block;
      width: 480px;
      height: 320px;
      /* position: absolute;
      top: 0;
      left: 0; */
    }

    #splash {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      opacity: 1;
    }

    #overlay {
      position: absolute;
      font-size: 16px;
      z-index: 2;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: rgba(0, 0, 0, 0.5);
    }

    #overlay::before {
      position: absolute;
      width: 100%;
      white-space: pre-wrap;
      content: "Waiting for ROS2 camera stream \A (topic: /stereo/left/rectified_images/compressed)";
      top: calc(50% + 50px);
      text-align: center;
      color: #949494;
    }

    #overlay button {
      background: transparent;
      border: 1px solid rgb(255, 255, 255);
      border-radius: 4px;
      color: #ffffff;
      padding: 12px 18px;
      text-transform: uppercase;
      cursor: pointer;
    }

    @keyframes fadeIn {
      0% { opacity: 0; }
      50% { opacity: 0.6; }
      100% { opacity: 1; }
    }

    @media screen and (max-device-width: 480px) and (orientation: landscape) {
      #container { display: none; }
      body::before {
        content: "Rotate device to portrait mode.";
        color: white;
      }
    }

    @media screen and (max-device-width: 480px) and (orientation: portrait) {
      #container { display: block; }
      body::before { content: none; }
    }
  </style>
</head>
<body>
<div id="container"></div>
<div id="overlay">
  <button id="start_button">Start</button>
  <div id="splash"></div>
</div>

<!-- ROS Bridge -->
<script src="https://cdn.jsdelivr.net/npm/roslib/build/roslib.min.js"></script>

<!-- Module Scripts -->
<script type="module">
  import { Stats } from "./assets/stats.js";
  import { AlvaAR } from './assets/alva_ar.js';
  import { ARCamView } from "./assets/view.js";
  import { onFrame } from "./assets/utils.js";

  function connectWebSocketFrameStream(callback) {
    let ws;
    let reconnectTimeout = null;

    function openWebSocket() {
      ws = new WebSocket("ws://localhost:8765");
      ws.binaryType = "blob";

      ws.onopen = () => {
        console.log("✅ Connected to WebSocket video stream");
      };

      ws.onerror = err => {
        console.error("❌ WebSocket error:", err);
      };

      ws.onclose = () => {
        console.warn("⚠️ WebSocket connection closed, reconnecting in 2 seconds...");
        // Attempt reconnect
        if (reconnectTimeout === null) {
          reconnectTimeout = setTimeout(() => {
            reconnectTimeout = null;
            openWebSocket();
          }, 2000);
        }
      };

      ws.onmessage = async event => {
        try {
          const blob = event.data;
          const bitmap = await createImageBitmap(blob);
          callback(bitmap);
        } catch (err) {
          console.error("❌ Failed to decode image blob:", err);
        }
      };
    }

    openWebSocket();

    return {
      close() {
        if (ws) ws.close();
        if (reconnectTimeout) {
          clearTimeout(reconnectTimeout);
          reconnectTimeout = null;
        }
      }
    };
  }

  function main() {
    const $container = document.getElementById('container');
    const $view = document.createElement('div');
    const $canvas = document.createElement('canvas');
    const $overlay = document.getElementById('overlay');
    const $start = document.getElementById('start_button');
    const $splash = document.getElementById('splash');
    const splashFadeTime = 800;

    // Make sure container and canvas fill window exactly
    function resize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      $container.style.width = w + 'px';
      $container.style.height = h + 'px';
      $canvas.width = w;
      $canvas.height = h;
      if (view) view.resize(w, h);
    }

    let alva, view, stats;
    let latestFrameBitmap = null;
    let wsConnection = null;

    async function demoStream() {
      // resize();
      const width = 480;
      const height = 320;

      $canvas.width = width;
      $canvas.height = height;

      const ctx = $canvas.getContext('2d');
      alva = await AlvaAR.Initialize($canvas.width, $canvas.height);
      view = new ARCamView($view, $canvas.width, $canvas.height);

      stats = Stats;
      stats.add('total');
      stats.add('video');
      stats.add('slam');

      $container.appendChild($canvas);
      $container.appendChild($view);
      document.body.appendChild(stats.el);

      document.body.addEventListener("click", () => alva.reset(), false);

      // Start WebSocket streaming and update latestFrameBitmap
      wsConnection = connectWebSocketFrameStream(bitmap => {
        latestFrameBitmap = bitmap;
      });

      // Render loop with requestAnimationFrame for smoothness
      function render() {
        stats.next();
        stats.start('total');

        ctx.clearRect(0, 0, $canvas.width, $canvas.height);

        if (!document.hidden && latestFrameBitmap) {
          stats.start('video');
          ctx.drawImage(latestFrameBitmap, 0, 0, $canvas.width, $canvas.height);
          const frame = ctx.getImageData(0, 0, $canvas.width, $canvas.height);
          stats.stop('video');

          stats.start('slam');
          const pose = alva.findCameraPose(frame);
          stats.stop('slam');

          if (pose) {
            view.updateCameraPose(pose);
          } else {
            view.lostCamera();
            const dots = alva.getFramePoints();
            for (const p of dots) {
              ctx.fillStyle = 'white';
              ctx.fillRect(p.x, p.y, 2, 2);
            }
          }
        }

        stats.stop('total');
        stats.render();
        requestAnimationFrame(render);
      }
      render();

      //window.addEventListener('resize', resize);
    }

    setTimeout(() => {
      $splash.remove();
      $start.addEventListener('click', () => {
        $overlay.remove();
        demoStream();
      }, { once: true });
    }, splashFadeTime);
  }

  window.addEventListener('load', main);
</script>

</body>
</html>
