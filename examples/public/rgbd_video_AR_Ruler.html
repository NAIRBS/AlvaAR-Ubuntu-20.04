<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,shrink-to-fit=no" name="viewport"/>
  <meta content="IE=edge" http-equiv="X-UA-Compatible"/>
  <title>RGBD Video AR Ruler - Distance Measurement</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      font-family: 'Helvetica', sans-serif;
      overflow: hidden;
      background: #000;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #main-container {
      display: flex;
      gap: 20px;
      align-items: flex-start;
    }

    #container {
      position: relative;
      width: 1280px;
      height: 480px;
      overflow: hidden;
      line-height: 0;
      border: 2px solid #333;
      box-shadow: 0 0 10px #000;
    }

    #container > * {
      position: absolute;
      display: block;
      user-select: none;
      top: 0;
      left: 0;
      width: 1280px;
      height: 480px;
      animation: fadeIn 1.2s;
    }

    #measurement-panel {
      width: 320px;
      height: 480px;
      border: 2px solid #333;
      box-shadow: 0 0 10px #000;
      background: #fff;
      position: relative;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }

    #measurement-panel::after {
      content: "AR Ruler - Distance Tool (RGBD Video)";
      position: absolute;
      top: 10px;
      left: 10px;
      color: #333;
      font-size: 14px;
      font-weight: bold;
      z-index: 10;
    }

    #distance-display {
      font-size: 2rem;
      font-weight: bold;
      text-align: center;
      margin: 20px 0 10px 0;
      padding: 15px;
      background: #f0f0f0;
      border-radius: 10px;
      border: 2px solid #333;
    }

    #status-display {
      font-size: 1rem;
      text-align: center;
      margin: 0 0 20px 0;
      padding: 8px;
      background: #e8f4fd;
      border-radius: 5px;
      border: 1px solid #007bff;
      color: #0056b3;
    }

    #crosshair {
      position: absolute;
      top: 50%;
      left: 320px; /* Center of left camera frame (640px / 2) */
      transform: translate(-50%, -50%);
      width: 20px;
      height: 20px;
      pointer-events: none;
      z-index: 1000;
    }

    #crosshair::before,
    #crosshair::after {
      content: '';
      position: absolute;
      background: #ffffff;
      box-shadow: 0 0 2px rgba(0, 0, 0, 0.8);
    }

    #crosshair::before {
      width: 2px;
      height: 20px;
      left: 50%;
      top: 0;
      transform: translateX(-50%);
    }

    #crosshair::after {
      width: 20px;
      height: 2px;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
    }

    #control-buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: auto;
    }

    #control-buttons button {
      padding: 12px 16px;
      font-size: 14px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    #place-marker {
      background: #28a745;
      color: white;
    }

    #place-marker:hover {
      background: #218838;
    }

    #end-measurement {
      background: #dc3545;
      color: white;
    }

    #end-measurement:hover {
      background: #c82333;
    }

    #reset-measurement {
      background: #6c757d;
      color: white;
    }

    #reset-measurement:hover {
      background: #5a6268;
    }

    canvas {
      display: block;
      width: 1280px;
      height: 480px;
    }

    #splash {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      opacity: 1;
    }

    #overlay {
      position: absolute;
      font-size: 16px;
      z-index: 2;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: rgba(0, 0, 0, 0.5);
    }

    #overlay::before {
      position: absolute;
      width: 100%;
      white-space: pre-wrap;
      content: "RGBD Video AR Ruler - Distance Measurement \A Using pre-recorded RGBD stereo video \A (v2_ruler_left_web.mp4 / v2_ruler_right_web.mp4)";
      top: calc(50% + 50px);
      text-align: center;
      color: #949494;
    }

    #overlay button {
      background: transparent;
      border: 1px solid white;
      border-radius: 4px;
      color: white;
      padding: 12px 18px;
      text-transform: uppercase;
      cursor: pointer;
    }

    @keyframes fadeIn {
      0% { opacity: 0; }
      50% { opacity: 0.6; }
      100% { opacity: 1; }
    }

    @media screen and (max-device-width: 480px) and (orientation: landscape) {
      #main-container { display: none; }
      body::before {
        content: "Rotate device to portrait mode.";
        color: white;
      }
    }

    @media screen and (max-device-width: 480px) and (orientation: portrait) {
      #main-container { display: flex; }
      body::before { content: none; }
    }
  </style>
</head>
<body>
  <div id="main-container">
    <div id="container">
      <div id="crosshair"></div>
    </div>
    <div id="measurement-panel">
      <div id="distance-display">0.000 meters</div>
      <div id="status-display">Place start marker</div>
      <div id="control-buttons">
        <button id="place-marker">Mark Start Point</button>
        <button id="end-measurement">Mark End Point</button>
        <button id="reset-measurement">Reset</button>
      </div>
    </div>
  </div>
<div id="overlay">
  <button id="start_button">Start</button>
  <div id="splash"></div>
</div>

<script type="module">
  import Module from './assets/alva_ar.js';
  import { Stats } from './assets/stats.js';
  import { ARCamView } from './assets/view.js';
  import { Video } from './assets/utils.js';
  import * as THREE from 'https://threejsfundamentals.org/threejs/resources/threejs/r132/build/three.module.js';

  async function waitForEmscriptenModule(ModuleInstance) {
    return new Promise(resolve => {
      if (ModuleInstance && ModuleInstance.calledRun) {
        resolve();
      } else if (ModuleInstance && typeof ModuleInstance.onRuntimeInitialized === 'function') {
        ModuleInstance.onRuntimeInitialized = resolve;
      } else {
        const check = setInterval(() => {
          if (ModuleInstance && ModuleInstance.calledRun) {
            clearInterval(check);
            resolve();
          }
        }, 50);
      }
    });
  }

  // AR Ruler Measurement System
  class ARRulerSystem {
    constructor() {
      this.startPoint = null;
      this.endPoint = null;
      this.measurementMode = 'placing'; // 'placing', 'measuring', 'complete'
      this.visualizer = null;
      this.ui = null;
      this.camera = null;
      this.raycaster = new THREE.Raycaster();
      this.mouse = new THREE.Vector2();
      this.measurementPlane = null;
    }

    initialize(visualizer, ui, camera) {
      this.visualizer = visualizer;
      this.ui = ui;
      this.camera = camera;
    }

    calculateDistance(startPoint, endPoint) {
      const dx = endPoint.x - startPoint.x;
      const dy = endPoint.y - startPoint.y;
      const dz = endPoint.z - startPoint.z;
      return Math.sqrt(dx*dx + dy*dy + dz*dz);
    }

    // Get camera position and direction from pose matrix
    getCameraTransform(poseMatrix) {
      const position = new THREE.Vector3(poseMatrix[12], poseMatrix[13], poseMatrix[14]);
      
      // Extract rotation matrix (3x3) from pose matrix
      const rotationMatrix = new THREE.Matrix3();
      rotationMatrix.set(
        poseMatrix[0], poseMatrix[1], poseMatrix[2],
        poseMatrix[4], poseMatrix[5], poseMatrix[6],
        poseMatrix[8], poseMatrix[9], poseMatrix[10]
      );
      
      // Get forward direction (negative Z axis in camera space)
      const direction = new THREE.Vector3(0, 0, -1);
      direction.applyMatrix3(rotationMatrix);
      
      return { position, direction };
    }

    // Raycast from camera center to find world point
    raycastToWorld(cameraPosition, cameraDirection, maxDistance = 10.0) {
      // Create a ray from camera position in camera direction
      const rayOrigin = cameraPosition.clone();
      const rayDirection = cameraDirection.clone();
      
      // Simple plane intersection calculation
      // Try multiple Y-level planes for intersection
      const yLevels = [0, 1, -0.5]; // Ground, table height, below ground
      
      for (const yLevel of yLevels) {
        // Calculate intersection with horizontal plane at y = yLevel
        if (Math.abs(rayDirection.y) > 0.001) { // Avoid division by zero
          const t = (yLevel - rayOrigin.y) / rayDirection.y;
          if (t > 0.1 && t < maxDistance) {
            const intersectionPoint = rayOrigin.clone().add(rayDirection.clone().multiplyScalar(t));
            return intersectionPoint;
          }
        }
      }
      
      // Fallback: point at fixed distance in front of camera
      return rayOrigin.clone().add(rayDirection.clone().multiplyScalar(2.0));
    }

    // Place marker at world point under crosshair
    placeStartMarker(currentPose) {
      const { position, direction } = this.getCameraTransform(currentPose);
      this.startPoint = this.raycastToWorld(position, direction);
      this.measurementMode = 'measuring';
      
      console.log('Camera position:', position);
      console.log('Camera direction:', direction);
      console.log('Raycast result:', this.startPoint);
      
      if (this.visualizer) {
        this.visualizer.createStartMarker(this.startPoint);
      }
      
      if (this.ui) {
        this.ui.updateStatus('Move camera to end point');
      }
      
      console.log('Start marker placed at:', this.startPoint);
    }

    // Place end marker at world point under crosshair
    placeEndMarker(currentPose) {
      const { position, direction } = this.getCameraTransform(currentPose);
      this.endPoint = this.raycastToWorld(position, direction);
      this.measurementMode = 'complete';
      
      if (this.visualizer) {
        this.visualizer.createEndMarker(this.endPoint);
      }
      
      const finalDistance = this.calculateDistance(this.startPoint, this.endPoint);
      
      if (this.ui) {
        this.ui.updateDistance(finalDistance);
        this.ui.updateStatus('Measurement complete');
      }
      
      console.log('End marker placed at:', this.endPoint);
      console.log('Final measurement:', finalDistance.toFixed(3), 'meters');
      
      return finalDistance;
    }

    resetMeasurement() {
      this.startPoint = null;
      this.endPoint = null;
      this.measurementMode = 'placing';
      
      if (this.visualizer) {
        this.visualizer.clearMarkers();
      }
      
      if (this.ui) {
        this.ui.updateDistance(0);
        this.ui.updateStatus('Place start marker');
      }
      
      console.log('Measurement reset');
    }

    updateMeasurement(currentPose) {
      if (this.measurementMode === 'measuring' && this.startPoint) {
        const { position, direction } = this.getCameraTransform(currentPose);
        const currentEndPoint = this.raycastToWorld(position, direction);
        const distance = this.calculateDistance(this.startPoint, currentEndPoint);
        
        if (this.ui) {
          this.ui.updateDistance(distance);
        }
        
        if (this.visualizer) {
          this.visualizer.updateMeasurementLine(this.startPoint, currentEndPoint, distance);
        }
      }
    }
  }

  // AR Ruler Visualizer
  class ARRulerVisualizer {
    constructor(scene) {
      this.scene = scene;
      this.startMarker = null;
      this.endMarker = null;
      this.measurementLine = null;
    }

    createStartMarker(position) {
      if (this.startMarker) {
        this.scene.remove(this.startMarker);
      }
      
      const geometry = new THREE.SphereGeometry(0.2, 16, 16);
      const material = new THREE.MeshBasicMaterial({ 
        color: 0x00ff00,
        transparent: true,
        opacity: 0.8
      });
      this.startMarker = new THREE.Mesh(geometry, material);
      this.startMarker.position.copy(position);
      this.scene.add(this.startMarker);
      
      console.log('Start marker created at:', position);
    }

    createEndMarker(position) {
      if (this.endMarker) {
        this.scene.remove(this.endMarker);
      }
      
      const geometry = new THREE.SphereGeometry(0.2, 16, 16);
      const material = new THREE.MeshBasicMaterial({ 
        color: 0xff0000,
        transparent: true,
        opacity: 0.8
      });
      this.endMarker = new THREE.Mesh(geometry, material);
      this.endMarker.position.copy(position);
      this.scene.add(this.endMarker);
      
      console.log('End marker created at:', position);
    }

    updateMeasurementLine(startPos, endPos, distance) {
      if (this.measurementLine) {
        this.scene.remove(this.measurementLine);
      }
      
      const geometry = new THREE.BufferGeometry().setFromPoints([startPos, endPos]);
      const material = new THREE.LineBasicMaterial({ 
        color: this.getDistanceColor(distance),
        linewidth: 5,
        transparent: true,
        opacity: 0.9
      });
      this.measurementLine = new THREE.Line(geometry, material);
      this.scene.add(this.measurementLine);
      
      console.log('Measurement line updated:', startPos, 'to', endPos, 'distance:', distance);
    }

    getDistanceColor(distance) {
      if (distance < 1) return 0x00ff00; // Green for close
      if (distance < 3) return 0xffff00; // Yellow for medium
      return 0xff0000; // Red for far
    }

    clearMarkers() {
      if (this.startMarker) {
        this.scene.remove(this.startMarker);
        this.startMarker = null;
      }
      if (this.endMarker) {
        this.scene.remove(this.endMarker);
        this.endMarker = null;
      }
      if (this.measurementLine) {
        this.scene.remove(this.measurementLine);
        this.measurementLine = null;
      }
    }
  }

  // Measurement UI Controller
  class MeasurementUI {
    constructor() {
      this.distanceDisplay = document.getElementById('distance-display');
      this.statusDisplay = document.getElementById('status-display');
      this.startButton = document.getElementById('place-marker');
      this.endButton = document.getElementById('end-measurement');
      this.resetButton = document.getElementById('reset-measurement');
      
      this.onStartMarkerRequested = null;
      this.onEndMeasurementRequested = null;
      this.onResetRequested = null;
      
      this.setupEventListeners();
    }

    setupEventListeners() {
      this.startButton.addEventListener('click', () => {
        if (this.onStartMarkerRequested) {
          this.onStartMarkerRequested();
        }
      });
      
      this.endButton.addEventListener('click', () => {
        if (this.onEndMeasurementRequested) {
          this.onEndMeasurementRequested();
        }
      });
      
      this.resetButton.addEventListener('click', () => {
        if (this.onResetRequested) {
          this.onResetRequested();
        }
      });
    }

    updateDistance(distance) {
      this.distanceDisplay.textContent = `${distance.toFixed(3)} meters`;
    }

    updateStatus(status) {
      if (this.statusDisplay) {
        this.statusDisplay.textContent = status;
      }
    }
  }

  async function main() {
    const $container = document.getElementById('container');
    const $view = document.createElement('div');
    const $canvas = document.createElement('canvas');
    const $overlay = document.getElementById('overlay');
    const $start = document.getElementById('start_button');
    const $splash = document.getElementById('splash');
    const splashFadeTime = 800;

    let alva, view, stats;
    let mediaLeft, mediaRight;
    let arRulerSystem, visualizer, measurementUI;

    async function demoStream() {
      const ModuleInstance = await Module();
      await waitForEmscriptenModule(ModuleInstance);
      
      // Fetch the YAML file and set it in the WASM module
      const yamlResponse = await fetch('./assets/d345i_640x480.yaml');
      const yamlText = await yamlResponse.text();
      if (typeof ModuleInstance.setStereoCalibrationYAML === 'function') {
        ModuleInstance.setStereoCalibrationYAML(yamlText);
      } else {
        console.error('setStereoCalibrationYAML is not available on the Module instance.');
      }
      
             // Persistent buffer allocation
       const leftFrameSize = 640 * 480 * 4;
       const framepointsBufSize = 4096 * 4;
       const leftPtr = ModuleInstance._malloc(leftFrameSize);
       const rightPtr = ModuleInstance._malloc(leftFrameSize);
       const framepointsBuf = ModuleInstance._malloc(framepointsBufSize);
      
      window.addEventListener('unload', () => {
        ModuleInstance._free(leftPtr);
        ModuleInstance._free(rightPtr);
        ModuleInstance._free(framepointsBuf);
      });
      
      alva = {
        findStereoCameraPose(leftFrame, rightFrame) {
          if (!ModuleInstance || typeof ModuleInstance.findStereoCameraPose !== 'function') {
            console.error('Emscripten Module or findStereoCameraPose not loaded');
            return null;
          }
          ModuleInstance.HEAPU8.set(leftFrame.data, leftPtr);
          ModuleInstance.HEAPU8.set(rightFrame.data, rightPtr);
          const posePtr = ModuleInstance._malloc(16 * 4);
          const ok = ModuleInstance.findStereoCameraPose(leftPtr, rightPtr, posePtr);
          let pose = null;
          if (ok) {
            pose = new Float32Array(ModuleInstance.HEAPF32.buffer, posePtr, 16).slice();
          }
          ModuleInstance._free(posePtr);
          return pose;
        },
        reset() {
          if (typeof ModuleInstance.reset === 'function') {
            ModuleInstance.reset();
          }
        },
        getFramePoints() {
          if (typeof ModuleInstance.getStereoFramePoints === 'function') {
            const n = 4096;
            const buf = ModuleInstance._malloc(n * 4 * 2); // 2 ints per point
            const numPoints = ModuleInstance.getStereoFramePoints(buf);
            const arr = new Int32Array(ModuleInstance.HEAP32.buffer, buf, numPoints * 2);
            const result = [];
            for (let i = 0; i < numPoints; ++i) {
              result.push({ x: arr[i * 2], y: arr[i * 2 + 1] });
            }
            ModuleInstance._free(buf);
            return result;
          }
          return [];
        }
      };

      // Load videos instead of WebSocket stream
      mediaLeft = await Video.Initialize('./assets/v2_ruler_left_web.mp4');
      mediaRight = await Video.Initialize('./assets/v2_ruler_right_web.mp4');
      mediaLeft.el.play();
      mediaLeft.el.loop = true;
      mediaRight.el.play();
      mediaRight.el.loop = true;

             // Restrict $view overlay to left image only
       $view.style.position = 'absolute';
       $view.style.left = '0px';
       $view.style.top = '0px';
       $view.style.width = '640px';
       $view.style.height = '480px';
       $view.style.zIndex = '10';
       view = new ARCamView($view, 640, 480, 0, 0, -8);
      
      // Remove the default hexagon object
      if (view.scene.children.length > 0) {
        view.scene.clear();
      }

      // Initialize AR Ruler system
      arRulerSystem = new ARRulerSystem();
      visualizer = new ARRulerVisualizer(view.scene);
      measurementUI = new MeasurementUI();
      
      arRulerSystem.initialize(visualizer, measurementUI, view.camera);

      // Setup UI callbacks
      measurementUI.onStartMarkerRequested = () => {
        if (latestPose) {
          arRulerSystem.placeStartMarker(latestPose);
        }
      };
      
      measurementUI.onEndMeasurementRequested = () => {
        if (latestPose) {
          const finalDistance = arRulerSystem.placeEndMarker(latestPose);
          console.log('Final measurement completed:', finalDistance.toFixed(3), 'meters');
        }
      };
      
      measurementUI.onResetRequested = () => {
        arRulerSystem.resetMeasurement();
      };

      stats = Stats;
      stats.add('total');
      stats.add('video');
      stats.add('slam');

      $container.appendChild($canvas);
      $container.appendChild($view);
      document.body.appendChild(stats.el);

      document.body.addEventListener("click", () => alva.reset(), false);

      let latestPose = null;
      let firstFrame = true;

      function render() {
        stats.next();
        stats.start('total');

                 const spacing = 0;
         const boxWidth = 640;
         const boxHeight = 480;
         const width = 640 * 2 + spacing;
         const height = 480;
         $canvas.width = width;
         $canvas.height = height;
        const ctx = $canvas.getContext('2d');
        ctx.clearRect(0, 0, $canvas.width, $canvas.height);

        let frameLeft = null;
        let frameRight = null;
        let pose = null;

        if (!document.hidden) {
          frameLeft = mediaLeft.getImageData();
          frameRight = mediaRight.getImageData();

          if (!frameLeft || !frameRight || !frameLeft.data.length || !frameRight.data.length) {
            requestAnimationFrame(render);
            return;
          }

          if (frameLeft && frameRight) {
            stats.start('video');
            
                         ctx.putImageData(frameLeft, 0, 0);
             ctx.putImageData(frameRight, 640 + spacing, 0);
            
            stats.stop('video');
            stats.start('slam');
            
            if (frameLeft && frameRight && frameLeft.data.length && frameRight.data.length) {
              if (firstFrame) {
                alva.reset();  // Reset LK tracker on first valid frame
                firstFrame = false;
              }
              pose = alva.findStereoCameraPose(frameLeft, frameRight);
            }
            stats.stop('slam');
            
            if (pose) {
              latestPose = pose;
              view.updateCameraPose(pose);
              
              // Update AR Ruler measurement
              arRulerSystem.updateMeasurement(pose);
            } else {
              view.lostCamera();
            }

            // Draw keypoints
            const dots = alva.getFramePoints();
            for (const p of dots) {
              ctx.fillStyle = 'white';
              ctx.fillRect(p.x, p.y, 2, 2);
            }
                     } else if (frameLeft) {
             ctx.putImageData(frameLeft, 0, 0);
             ctx.fillStyle = "rgba(0,0,0,0.6)";
             ctx.fillRect(0, 0, 110, 25);
             ctx.fillStyle = "white";
             ctx.font = "16px Helvetica";
             ctx.fillText("Left Camera", 10, 18);
           }
           if (frameRight) {
             ctx.putImageData(frameRight, 640, 0);
             ctx.fillStyle = "rgba(0,0,0,0.6)";
             ctx.fillRect(640, 0, 120, 25);
             ctx.fillStyle = "white";
             ctx.font = "16px Helvetica";
             ctx.fillText("Right Camera", 650, 18);
           }
           ctx.beginPath();
           ctx.moveTo(640, 0);
           ctx.lineTo(640, 480);
           ctx.strokeStyle = "#333";
           ctx.lineWidth = 2;
           ctx.stroke();
        }
        stats.stop('total');
        stats.render();
        requestAnimationFrame(render);
      }
      render();
    }

    setTimeout(() => {
      $splash.remove();
      $start.addEventListener('click', () => {
        $overlay.remove();
        demoStream();
      }, { once: true });
    }, splashFadeTime);
  }

  window.addEventListener('load', main);
</script>
</body>
</html>
