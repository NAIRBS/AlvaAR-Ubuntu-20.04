<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,shrink-to-fit=no" name="viewport"/>
  <meta content="IE=edge" http-equiv="X-UA-Compatible"/>
  <title>AlvaAR Mono Viewer (Video Source)</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      font-family: 'Helvetica', sans-serif;
      overflow: hidden;
      background: #000;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #container {
      position: relative;
      width: 960px;
      height: 320px;
      overflow: hidden;
      line-height: 0;
      border: 2px solid #333;
      box-shadow: 0 0 10px #000;
    }

    #container > * {
      position: absolute;
      display: block;
      user-select: none;
      top: 0;
      left: 0;
      width: 960px;
      height: 320px;
      animation: fadeIn 1.2s;
    }

    canvas {
      display: block;
      width: 960px;
      height: 320px;
    }

    #splash {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      opacity: 1;
    }

    #overlay {
      position: absolute;
      font-size: 16px;
      z-index: 2;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: rgba(0, 0, 0, 0.5);
    }

    #overlay button {
      background: transparent;
      border: 1px solid white;
      border-radius: 4px;
      color: white;
      padding: 12px 18px;
      text-transform: uppercase;
      cursor: pointer;
    }

    @keyframes fadeIn {
      0% { opacity: 0; }
      50% { opacity: 0.6; }
      100% { opacity: 1; }
    }

    @media screen and (max-device-width: 480px) and (orientation: landscape) {
      #container { display: none; }
      body::before {
        content: "Rotate device to portrait mode.";
        color: white;
      }
    }

    @media screen and (max-device-width: 480px) and (orientation: portrait) {
      #container { display: block; }
      body::before { content: none; }
    }
  </style>
</head>
<body>
<div id="container"></div>
<div id="overlay">
  <button id="start_button">Start</button>
  <div id="splash"></div>
</div>

<script type="module">
  import { Stats } from "./assets/stats.js";
  import { AlvaAR } from './assets/alva_ar.js';
  import { ARCamView } from "./assets/view.js";
  import { Video } from "./assets/utils.js";

  function main() {
    const $container = document.getElementById('container');
    const $view = document.createElement('div');
    const $canvas = document.createElement('canvas');
    const $overlay = document.getElementById('overlay');
    const $start = document.getElementById('start_button');
    const $splash = document.getElementById('splash');
    const splashFadeTime = 800;

    let alva, view, stats;
    let mediaLeft, mediaRight;

    async function demoStream() {
      const spacing = 0;
      const boxWidth = 480;
      const boxHeight = 320;
      const width = 480 * 2 + spacing;
      const height = 320;

      $canvas.width = width;
      $canvas.height = height;

      const ctx = $canvas.getContext('2d');
      alva = await AlvaAR.Initialize(480, 320); // SLAM on left feed only
      view = new ARCamView($view, 480, 320);

      stats = Stats;
      stats.add('total');
      stats.add('video');
      stats.add('slam');

      $container.appendChild($canvas);
      $container.appendChild($view);
      document.body.appendChild(stats.el);

      document.body.addEventListener("click", () => alva.reset(), false);

      // Initialize videos (can be same or different)
      mediaLeft = await Video.Initialize('./assets/left_web.mp4');
      mediaRight = await Video.Initialize('./assets/right_web.mp4');

      mediaLeft.el.play();
      mediaLeft.el.loop = true;
      mediaRight.el.play();
      mediaRight.el.loop = true;

      function render() {
        stats.next();
        stats.start('total');

        ctx.clearRect(0, 0, $canvas.width, $canvas.height);

        if (!document.hidden) {
          // LEFT VIDEO + SLAM
          stats.start('video');
          const frameLeft = mediaLeft.getImageData();
          ctx.putImageData(frameLeft, 0, 0);
          stats.stop('video');

          stats.start('slam');
          const pose = alva.findCameraPose(frameLeft);
          stats.stop('slam');

          if (pose) {
            view.updateCameraPose(pose);
          } else {
            view.lostCamera();
            const dots = alva.getFramePoints();
            for (const p of dots) {
              ctx.fillStyle = 'white';
              ctx.fillRect(p.x, p.y, 2, 2);
            }
          }

          // Label
          ctx.fillStyle = "rgba(0,0,0,0.6)";
          ctx.fillRect(0, 0, 110, 25);
          ctx.fillStyle = "white";
          ctx.font = "16px Helvetica";
          ctx.fillText("Left Camera", 10, 18);

          // RIGHT VIDEO
          const frameRight = mediaRight.getImageData();
          ctx.putImageData(frameRight, 480 + spacing, 0);

          // Label
          ctx.fillStyle = "rgba(0,0,0,0.6)";
          ctx.fillRect(480, 0, 120 + spacing, 25);
          ctx.fillStyle = "white";
          ctx.font = "16px Helvetica";
          ctx.fillText("Right Camera", 490 + spacing, 18);
        }

        stats.stop('total');
        stats.render();
        requestAnimationFrame(render);
      }

      render();
    }

    setTimeout(() => {
      $splash.remove();
      $start.addEventListener('click', () => {
        $overlay.remove();
        demoStream();
      }, { once: true });
    }, splashFadeTime);
  }

  window.addEventListener('load', main);
</script>
</body>
</html>
