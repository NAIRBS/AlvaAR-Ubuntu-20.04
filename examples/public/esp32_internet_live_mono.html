<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,shrink-to-fit=no" name="viewport"/>
  <meta content="IE=edge" http-equiv="X-UA-Compatible"/>
  <title>Mono Live ESP32</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      font-family: 'Helvetica', sans-serif;
      overflow: hidden;
      background: #000;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #container {
      position: relative;
      width: 960px;
      height: 320px;
      overflow: hidden;
      line-height: 0;
      border: 2px solid #333;
      box-shadow: 0 0 10px #000;
    }

    #container > * {
      position: absolute;
      display: block;
      user-select: none;
      top: 0;
      left: 0;
      width: 960px;
      height: 320px;
      animation: fadeIn 1.2s;
    }

    canvas {
      display: block;
      width: 960px;
      height: 320px;
    }

    #splash {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      opacity: 1;
    }

    #overlay {
      position: absolute;
      font-size: 16px;
      z-index: 2;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: rgba(0, 0, 0, 0.5);
    }

    #overlay::before {
      position: absolute;
      width: 100%;
      white-space: pre-wrap;
      content: "Waiting for ROS2 camera stream \A (topics: /stereo/left/rectified_images/compressed) \A (topics: /stereo/right/rectified_images/compressed)";
      top: calc(50% + 50px);
      text-align: center;
      color: #949494;
    }

    #overlay button {
      background: transparent;
      border: 1px solid white;
      border-radius: 4px;
      color: white;
      padding: 12px 18px;
      text-transform: uppercase;
      cursor: pointer;
    }

    @keyframes fadeIn {
      0% { opacity: 0; }
      50% { opacity: 0.6; }
      100% { opacity: 1; }
    }

    @media screen and (max-device-width: 480px) and (orientation: landscape) {
      #container { display: none; }
      body::before {
        content: "Rotate device to portrait mode.";
        color: white;
      }
    }

    @media screen and (max-device-width: 480px) and (orientation: portrait) {
      #container { display: block; }
      body::before { content: none; }
    }
  </style>
</head>
<body>
<div id="container"></div>
<div id="overlay">
  <button id="start_button">Start</button>
  <div id="splash"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/roslib/build/roslib.min.js"></script>

<script type="module">
  import { Stats } from "./assets/stats.js";
  import { AlvaAR } from './assets/alva_ar.js';
  import { ARCamView } from "./assets/view.js";

  function connectWebSocketFrameStream(callback) {
    //const ws = new WebSocket("wss://NAIRB-DESK.local:8765"); // try with non static IP
    //const ws = new WebSocket("ws://172.21.0.1:8765"); // try with avahi resolve host static name
    const ws = new WebSocket("wss://172.21.1.30:8765"); // try with desktop WSL IP
    ws.binaryType = "arraybuffer";

    ws.onopen = () => {
      console.log("✅ Connected to WebSocket video stream");
    };

    ws.onerror = err => {
      console.error("❌ WebSocket error:", err);
    };

    ws.onclose = () => {
      console.warn("⚠️ WebSocket connection closed");
    };

    ws.onmessage = async event => {
      try {
        const arrayBuffer = event.data;
        const view = new Uint8Array(arrayBuffer);
        const sourceTag = String.fromCharCode(view[0]); // 'L' or 'R'
        const jpegData = view.slice(1);

        const blob = new Blob([jpegData], { type: 'image/jpeg' });
        const bitmap = await createImageBitmap(blob);

        callback(sourceTag, bitmap);
      } catch (err) {
        console.error("❌ Failed to decode image blob:", err);
      }
    };

    return {
      close() {
        if (ws) ws.close();
      }
    };
  }

  function main() {
    const $container = document.getElementById('container');
    const $view = document.createElement('div');
    const $canvas = document.createElement('canvas');
    const $overlay = document.getElementById('overlay');
    const $start = document.getElementById('start_button');
    const $splash = document.getElementById('splash');
    const splashFadeTime = 800;

    let alva, view, stats;
    let latestFrameBitmapLeft = null;
    let latestFrameBitmapRight = null;

    async function demoStream() {
      const spacing = 0; // CHANGE THIS TO ADD SPACING BETWEEN THE CAMERA FEEDS!!!
      const boxWidth = 480;
      const boxHeight = 320;
      const width = 480 * 2 + spacing;
      const height = 320;

      $canvas.width = width;
      $canvas.height = height;

      const ctx = $canvas.getContext('2d');
      alva = await AlvaAR.Initialize(480, 320); // only use left size
      view = new ARCamView($view, 480, 320);

      stats = Stats;
      stats.add('total');
      stats.add('video');
      stats.add('slam');

      $container.appendChild($canvas);
      $container.appendChild($view);
      document.body.appendChild(stats.el);

      document.body.addEventListener("click", () => alva.reset(), false);

      connectWebSocketFrameStream((source, bitmap) => {
        if (source === 'L') latestFrameBitmapLeft = bitmap;
        else if (source === 'R') latestFrameBitmapRight = bitmap;
      });

      function render() {
        stats.next();
        stats.start('total');

        ctx.clearRect(0, 0, $canvas.width, $canvas.height);

        if (!document.hidden) {
          // Left Image + SLAM
          if (latestFrameBitmapLeft) {
            ctx.drawImage(latestFrameBitmapLeft, 0, 0, 480, 320);

            // Run SLAM on left image
            stats.start('video');
            const frame = ctx.getImageData(0, 0, 480, 320);
            stats.stop('video');

            stats.start('slam');
            const pose = alva.findCameraPose(frame);
            stats.stop('slam');

            if (pose) {
              view.updateCameraPose(pose);
            } else {
              view.lostCamera();
              const dots = alva.getFramePoints();
              for (const p of dots) {
                ctx.fillStyle = 'white';
                ctx.fillRect(p.x, p.y, 2, 2);
              }
            }

            // Label
            ctx.fillStyle = "rgba(0,0,0,0.6)";
            ctx.fillRect(0, 0, 110, 25);
            ctx.fillStyle = "white";
            ctx.font = "16px Helvetica";
            ctx.fillText("Left Camera", 10, 18);
          }

          // Right Image
          if (latestFrameBitmapRight) {
            ctx.drawImage(latestFrameBitmapRight, 480 + spacing, 0, 480, 320);

            // Label
            ctx.fillStyle = "rgba(0,0,0,0.6)";
            ctx.fillRect(480, 0, 120 + spacing, 25);
            ctx.fillStyle = "white";
            ctx.font = "16px Helvetica";
            ctx.fillText("Right Camera", 490 + spacing, 18);
          }

          // Draw left separator line at the right edge of left box (x = 480)
          ctx.beginPath();
          ctx.moveTo(boxWidth, 0);
          ctx.lineTo(boxWidth, boxHeight);
          ctx.strokeStyle = "#333";
          ctx.lineWidth = 2;
          ctx.stroke();

          // Draw right separator line at the left edge of right box (x = 480 + spacing)
          ctx.beginPath();
          ctx.moveTo(boxWidth + spacing, 0);
          ctx.lineTo(boxWidth + spacing, boxHeight);
          ctx.strokeStyle = "#333";
          ctx.lineWidth = 2;
          ctx.stroke();
        }

        stats.stop('total');
        stats.render();
        requestAnimationFrame(render);
      }

      render();
    }

    setTimeout(() => {
      $splash.remove();
      $start.addEventListener('click', () => {
        $overlay.remove();
        demoStream();
      }, { once: true });
    }, splashFadeTime);
  }

  window.addEventListener('load', main);
</script>

</body>
</html>
